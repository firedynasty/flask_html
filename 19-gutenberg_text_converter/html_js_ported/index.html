Things from God?\n\nWe have the authority of the Book of Proverbs for answering in the affirmative, for there we read[138]: Give me only the necessaries of life.\n\nS. Augustine says to Proba[139]: \"It is lawful to pray for what it is lawful to desire.\" But it is lawful to desire temporal things, not indeed as our principal aim or as something which we make our end, but rather as props and stays which may be of assistance to us in our striving for the possession of God; for by such things our bodily life is sustained, and such things, as the Philosopher says, co-operate organically to the production of virtuous acts.[140] Consequently it is lawful to pray for temporal things. And this is what S. Augustine means when he says to Proba: \"Not unfittingly does a person desire sufficiency for this life when he desires it and nothing more; for such sufficiency is not sought for its own sake but for the body's health, and for a mode of life suitable to a man's position so that he may not be a source of inconvenience to those with whom he lives. When, then, we have these things we must pray that we may retain them, and when we have not got them we must pray that we may have them.\"[141]\n\nSome, however, argue that we ought not to pray for temporal things, thus:\n\n1. What we pray for we seek. But we are forbidden to seek for temporal things, for it is said: Seek ye therefore first the kingdom of God, and His justice, and all these things shall be added unto you,[142] those temporal things, namely, which He says are not to be sought but which are to be added to the things which we seek.\n\nBut temporal things are to be sought secondarily not primarily. Hence S. Augustine[143]: \"When He says the former is to be sought first (namely the kingdom of God), He means that the latter (namely temporal good things) are to be sought afterwards; not afterwards in point of time, but afterwards in point of importance; the former as our good, the latter as our need.\"\n\n2. Again, we only ask for things about which we are solicitous. But we are not allowed to be solicitous about temporal concerns: Be not solicitous for your life, what ye shall eat[144]....\n\nBut not all solicitude about temporal affairs is forbidden, only such as is superfluous and out of due order.\n\n3. Further, we ought in prayer to uplift our minds to God. But by asking for temporal things in prayer our mind descends to things beneath it, and this is contrary to the teaching of the Apostle: While we look not at the things which are seen, but at the things which are not seen. For the things which are seen are temporal: but the things which are not seen are eternal.[145]\n\nWhen our mind is occupied with temporal affairs so as to set up its rest in them then it remains in them, and is depressed by them; but when the mind turns to them as a means of attaining to eternal life it is not depressed by them, but rather uplifted by them.\n\n4. Lastly, men ought not to pray except for things useful and good. But temporal possessions are at times hurtful, and this not merely spiritually but even temporally; hence a man ought not to ask them of God.\n\nBut it is clear that since we do not seek temporal things primarily or for their own sake, but with reference to something else, we consequently only ask them of God according as they may be expedient for our salvation.\n\nS. Augustine: Lord, all my desire is before Thee, and my groaning is not hid from Thee![146] It is not before men who cannot see the heart, but before Thee is all my desire! And let your desires, too, be before Him, and your Father Who seeth in secret will repay thee. For your very desire is a prayer, and if your desire is continual your prayer, too, is continual. Not without reason did the Apostle say: Pray without ceasing.[147] Yet can we genuflect without ceasing? Can we prostrate without ceasing? Can we lift up our hands without ceasing? How, then, does he say: Pray without ceasing? If by prayer he meant such things as these then I think we could not pray without ceasing. But there is another prayer, an interior prayer, which is without ceasing—desire. Whatever else you do, if only you desire that rest[148] you cease not to pray. If you wish to pray without ceasing then desire without ceasing. Your continual desire is your continual voice; but you will be silent if you cease to love (Enarr. in Ps. xxxvii. 10).\n\nS. Augustine: But all these things are the gifts of my God; I did not give them to myself; they are good, and all these things am I. He then is good Who made me; nay, He Himself is my Good, and in Him do I rejoice for all the good things which I had even as a boy! But in this did I sin that, not in Him but in His creatures did I seek myself and other pleasures, high thoughts and truths. Thus it was that I fell into sorrow, confusion, and error. Thanks be to Thee, my Sweetness, my Honour and my Trust, O my God! Thanks be to Thee for Thy gifts! But do Thou keep them for me! For so doing Thou wilt be keeping me, and those things which Thou hast given me will be increased and perfected, and I myself shall be with Thee, for even that I should be at all is Thy gift to me! (Confessions, I. xx. 2).\n\nS. Augustine: But I forget not, neither will I keep silence regarding the severity of Thy scourge and the wondrous swiftness of Thy mercy. Thou didst torture me with toothache; and when the pain had become so great that I could not even speak, it came into my mind to tell all my friends who were there to pray to Thee for me, to Thee the God of all manner of succour. And I wrote my request on a wax tablet and I gave it them to read. And hardly had we bent the knee in humble prayer than the pain fled! But what a pain it was! And how did it disappear? I was terrified, I confess it, O Lord my God! Never in all my life had I felt anything like it! (Confessions, IX. iv. 12).\n\nIt is narrated of S. Thomas that when at Paris it happened that having to lecture at the University on a subject which he had commenced the day before, he rose at night to pray as was his wont, but discovered that a tooth had suddenly pushed its way through his gums in such a way that he could not speak. His companion suggested that since it was an inopportune time for procuring assistance a message should be sent to the University stating what had happened and pointing out that the lecture could not be given till the tooth had been removed by a surgeon. But S. Thomas, reflecting upon the difficulty in which the University would be placed, considering also the danger which might arise from the removal of the tooth in the way suggested, said to his companion: I see no remedy save to trust to God's Providence. He then betook himself to his accustomed place of prayer, and for a long space besought God with tears to grant him this favour, leaving himself entirely in His hands. And when he had thus prayed he took the tooth between his fingers, and it came out at once without the slightest pain or wrench, and he found himself freed from the impediment to his speech which it had caused. This tooth he carried about with him for a long time as a reminder of an act of Divine loving-kindness such as he was anxious not to forget, for forgetfulness is the mother of ingratitude; he wished it, too, to move him to still greater confidence in the power of prayer which had on that occasion been so quickly heard (see Vita S. Thomæ, Bollandists, March 7, vol. i., 1865, pp. 673, 704, 712).\n\nS. Augustine: But temporal things are sometimes for our profit, sometimes for our hurt. For many poverty was good, wealth did them harm. For many a hidden life was best, high station did them harm. And on the other hand money was good for some, and dignities, too, were good for them—good, that is, for those who used them well; but such things did harm when not taken away from those who used them ill. Consequently, brethren, let us ask for these temporal things with moderation, being sure that if we do receive them, He gives them Who knoweth what is best suited to us. You have asked for something, then, and what you asked for has not been given you? Believe in your Father Who would give it you if it were expedient for you (Sermon, lxxx. 7).\n\nS. Augustine: Sometimes God in His wrath grants what you ask; at other times in His mercy He refuses what you ask. When, then, you ask of Him things which He praises, which He commands, things which He has promised us in the next world, then ask in confidence and be instant in prayer as far as in you lies, that so you may receive what you ask. For such things as these are granted by the God of mercy; they flow not from His wrath but from His compassion. But when you ask for temporal things, then ask with moderation, ask with fear; leave all to Him so that if they be for your profit He may give them you, if they be to your hurt He may refuse them. For what is for our good and what is to our hurt the Physician knoweth, not the patient (Sermon, cccliv. 8).\n\n\"Cast thy care upon the Lord, and He shall sustain thee; He shall not suffer the just to waver for ever.\"[149]", "outline": "# VI Ought We in our Prayers to ask for Temporal Things from God?\n\n- VI\n- Ought We in our Prayers to ask for Temporal Things from God?\n- We have the authority of the Book of Proverbs for answering in the affirmative, for there we read[138]: Give me only the necessaries of life.\n- S. Augustine says to Proba[139]: \"It is lawful to pray for what it is lawful to desire\n  - But it is lawful to desire temporal things, not indeed as our principal aim or as something which we make our end, but rather as props and stays which may be of assistance to us in our striving for the possession of God; for by such things our bodily life is sustained, and such things, as the Philosopher says, co-operate organically to the production of virtuous acts.[140] [contrast]\n  - Consequently it is lawful to pray for temporal things [consequence]\n    - And this is what S. Augustine means when he says to Proba: \"Not unfittingly does a person desire sufficiency for this life when he desires it and nothing more; for such sufficiency is not sought for its own sake but for the body's health, and for a mode of life suitable to a man's position so that he may not be a source of inconvenience to those with whom he lives [restatement]\n  - When, then, we have these things we must pray that we may retain them, and when we have not got them we must pray that we may have them.\"[141] [qualification]\n- Some, however, argue that we ought not to pray for temporal things, thus:\n- 1. What we pray for we seek\n  - But we are forbidden to seek for temporal things, for it is said: Seek ye therefore first the kingdom of God, and His justice, and all these things shall be added unto you,[142] those temporal things, namely, which He says are not to be sought but which are to be added to the things which we seek. [contrast]\n- But temporal things are to be sought secondarily not primarily\n  - Hence S. Augustine[143]: \"When He says the former is to be sought first (namely the kingdom of God), He means that the latter (namely temporal good things) are to be sought afterwards; not afterwards in point of time, but afterwards in point of importance; the former as our good, the latter as our need.\" [consequence]\n- 2. Again, we only ask for things about which we are solicitous\n  - But we are not allowed to be solicitous about temporal concerns: Be not solicitous for your life, what ye shall eat[144].... [contrast]\n- But not all solicitude about temporal affairs is forbidden, only such as is superfluous and out of due order.\n- 3. Further, we ought in prayer to uplift our minds to God\n  - But by asking for temporal things in prayer our mind descends to things beneath it, and this is contrary to the teaching of the Apostle: While we look not at the things which are seen, but at the things which are not seen [contrast]\n  - For the things which are seen are temporal: but the things which are not seen are eternal.[145] [evidence]\n- When our mind is occupied with temporal affairs so as to set up its rest in them then it remains in them, and is depressed by them; but when the mind turns to them as a means of attaining to eternal life it is not depressed by them, but rather uplifted by them.\n- 4. Lastly, men ought not to pray except for things useful and good\n  - But temporal possessions are at times hurtful, and this not merely spiritually but even temporally; hence a man ought not to ask them of God. [contrast]\n- But it is clear that since we do not seek temporal things primarily or for their own sake, but with reference to something else, we consequently only ask them of God according as they may be expedient for our salvation.\n- S. Augustine: Lord, all my desire is before Thee, and my groaning is not hid from Thee![146]\n  - It is not before men who cannot see the heart, but before Thee is all my desire [restatement]\n    - And let your desires, too, be before Him, and your Father Who seeth in secret will repay thee [restatement]\n  - For your very desire is a prayer, and if your desire is continual your prayer, too, is continual [evidence]\n  - Yet can we genuflect without ceasing [contrast]\n    - Can we prostrate without ceasing [restatement]\n      - Can we lift up our hands without ceasing [restatement]\n  - How, then, does he say: Pray without ceasing [restatement]\n  - If by prayer he meant such things as these then I think we could not pray without ceasing [qualification]\n  - But there is another prayer, an interior prayer, which is without ceasing—desire [contrast]\n    - Whatever else you do, if only you desire that rest[148] you cease not to pray [restatement]\n  - If you wish to pray without ceasing then desire without ceasing [qualification]\n    - Your continual desire is your continual voice; but you will be silent if you cease to love (Enarr. in Ps. xxxvii [restatement]\n- Not without reason did the Apostle say: Pray without ceasing.[147]\n- 10).\n- S. Augustine: But all these things are the gifts of my God; I did not give them to myself; they are good, and all these things am I. He then is good Who made me; nay, He Himself is my Good, and in Him do I rejoice for all the good things which I had even as a boy\n  - But in this did I sin that, not in Him but in His creatures did I seek myself and other pleasures, high thoughts and truths [contrast]\n  - Thus it was that I fell into sorrow, confusion, and error [consequence]\n  - Thanks be to Thee for Thy gifts [restatement]\n  - But do Thou keep them for me [contrast]\n  - For so doing Thou wilt be keeping me, and those things which Thou hast given me will be increased and perfected, and I myself shall be with Thee, for even that I should be at all is Thy gift to me [evidence]\n- Thanks be to Thee, my Sweetness, my Honour and my Trust, O my God\n- (Confessions, I. xx\n- 2).\n- S. Augustine: But I forget not, neither will I keep silence regarding the severity of Thy scourge and the wondrous swiftness of Thy mercy\n  - And I wrote my request on a wax tablet and I gave it them to read [restatement]\n    - And hardly had we bent the knee in humble prayer than the pain fled [restatement]\n  - But what a pain it was [contrast]\n    - And how did it disappear [restatement]\n- Thou didst torture me with toothache; and when the pain had become so great that I could not even speak, it came into my mind to tell all my friends who were there to pray to Thee for me, to Thee the God of all manner of succour\n- I was terrified, I confess it, O Lord my God\n- Never in all my life had I felt anything like it\n- (Confessions, IX. iv\n- 12).\n- It is narrated of S. Thomas that when at Paris it happened that having to lecture at the University on a subject which he had commenced the day before, he rose at night to pray as was his wont, but discovered that a tooth had suddenly pushed its way through his gums in such a way that he could not speak\n  - His companion suggested that since it was an inopportune time for procuring assistance a message should be sent to the University stating what had happened and pointing out that the lecture could not be given till the tooth had been removed by a surgeon [restatement]\n  - But S. Thomas, reflecting upon the difficulty in which the University would be placed, considering also the danger which might arise from the removal of the tooth in the way suggested, said to his companion: I see no remedy save to trust to God's Providence [contrast]\n    - He then betook himself to his accustomed place of prayer, and for a long space besought God with tears to grant him this favour, leaving himself entirely in His hands [restatement]\n      - And when he had thus prayed he took the tooth between his fingers, and it came out at once without the slightest pain or wrench, and he found himself freed from the impediment to his speech which it had caused [restatement]\n  - This tooth he carried about with him for a long time as a reminder of an act of Divine loving-kindness such as he was anxious not to forget, for forgetfulness is the mother of ingratitude; he wished it, too, to move him to still greater confidence in the power of prayer which had on that occasion been so quickly heard (see Vita S. Thomæ, Bollandists, March 7, vol. i., 1865, pp [restatement]\n- 673, 704, 712).\n- S. Augustine: But temporal things are sometimes for our profit, sometimes for our hurt\n  - For many poverty was good, wealth did them harm [evidence]\n  - For many a hidden life was best, high station did them harm [evidence]\n    - And on the other hand money was good for some, and dignities, too, were good for them—good, that is, for those who used them well; but such things did harm when not taken away from those who used them ill [restatement]\n  - Consequently, brethren, let us ask for these temporal things with moderation, being sure that if we do receive them, He gives them Who knoweth what is best suited to us [consequence]\n- You have asked for something, then, and what you asked for has not been given you\n- Believe in your Father Who would give it you if it were expedient for you (Sermon, lxxx\n- 7).\n- S. Augustine: Sometimes God in His wrath grants what you ask; at other times in His mercy He refuses what you ask\n  - When, then, you ask of Him things which He praises, which He commands, things which He has promised us in the next world, then ask in confidence and be instant in prayer as far as in you lies, that so you may receive what you ask [qualification]\n  - For such things as these are granted by the God of mercy; they flow not from His wrath but from His compassion [evidence]\n  - But when you ask for temporal things, then ask with moderation, ask with fear; leave all to Him so that if they be for your profit He may give them you, if they be to your hurt He may refuse them [contrast]\n  - For what is for our good and what is to our hurt the Physician knoweth, not the patient (Sermon, cccliv [evidence]\n- 8).\n- \"Cast thy care upon the Lord, and He shall sustain thee; He shall not suffer the just to waver for ever.\"[149]\n", "stats": {"coverage": 100.0, "n_inserted": 0, "nodes": 79, "max_depth": 4, "unplaced": 15, "tags": {"contrast": 12, "consequence": 4, "restatement": 17, "qualification": 4, "evidence": 7}}}, {"slug": "27-vii-ought-we-to-pray-for-others", "title": "VII Ought We To Pray for Others?", "group": "QUESTION LXXXIII — OF PRAYER", "words": 895, "body": "VII\n\nOught We To Pray for Others?\n\nS. James, in his Epistle, says[150]: Pray for one another that ye may be saved.\n\nAs we said above, we ought in prayer to ask for those things which we ought to desire. But we ought to desire good things not for ourselves only but also for others, for this belongs to that charity which we ought to exercise towards our neighbour. Hence charity demands that we pray for others. In accordance with this S. Chrysostom says[151]: \"Necessity compels us to pray for ourselves, fraternal charity urges us to pray for others. But that prayer is more pleasing before God which arises not so much from our needs as from the demands of fraternal charity.\"\n\nSome, however, urge that we ought not to pray for others, thus:\n\n1. We are bound in our prayer to follow the norm which our Lord delivered to us; but in the Lord's Prayer we pray for ourselves and not for others, for we say: Give us this day our daily bread, etc.\n\nBut S. Cyprian says:[152] \"We do not say my Father, but our Father, neither do we say Give me, but give us; and this because the Teacher of Unity did not wish prayer to be made privately, viz., that each should pray for himself alone; for He wished one to pray for all since He in His single Person had borne all.\"\n\n2. Again, we pray in order to be heard; but one of the conditions for our prayer to be heard is that a man should pray for himself. Thus on the words: If ye ask the Father anything in My Name He will give it you,[153] S. Augustine says:[154] \"All are heard for themselves, but not for all in general, hence He does not say simply: He will give it, but He will give it you.\"\n\nBut to pray for oneself is a condition attaching to prayer; not indeed a condition affecting its merit, but a condition which is necessary if we would ensure the attainment of what we ask. For it sometimes happens that prayer made for another does not avail even though it be devout and persevering and for things pertaining to a man's salvation; and this is because of the existence of some hindrance on the part of him for whom we pray, as we read in Jeremias[155]: If Moses and Samuel shall stand before Me, My soul is not towards this people. None the less, such prayer will be meritorious on the part of him who prays, for he prays out of charity; thus on the words, And my prayer shall be turned into my bosom,[156] the Interlinear Gloss has: \"That is, and even though it avail not for them, yet shall I not be without my reward.\"\n\n3. Lastly, we are forbidden to pray for others if they are wicked, according to the words: Do not thou pray for this people ... and do not withstand Me, for I will not hear thee.[157] And, on the other hand, we ought not to pray for them if they are good, for in that case they will be heard when they pray for themselves.\n\nBut we have to pray even for sinners, that they may be converted, and for the good, that they may persevere and make progress. Our prayers for sinners, however, are not heard for all, but for some. For they are heard for those who are predestined, not for those who are foreknown as reprobate; just in the same way as when we correct our brethren, such corrections avail among the predestinate but not among the reprobate, according to the words: No man can correct whom He hath despised.[158] Wherefore also it is said: He that knoweth his brother to sin a sin that is not unto death, let him ask, and life shall be given to him who sinneth not to death.[159] But just as we can refuse to no one, as long as he liveth on this earth, the benefit of correction—for we cannot distinguish between the predestinate and the reprobate, as S. Augustine says[160]—so neither can we refuse to anyone the suffrage of our prayers.\n\nAnd for good men we have to pray, and this for a threefold reason: firstly, because the prayers of many are more easily heard; thus on the words: I beseech ye therefore, help me in your prayers for me,[161] the Ordinary Gloss of S. Ambrose says: \"Well does the Apostle ask his inferiors to pray for him; for even the very least become great when many in number, and when gathered together with one mind; and it is impossible that the prayers of many should not avail\" to obtain, that is, what is obtainable. And secondly, that thanks may be returned by many for the benefits conferred by God upon the just, for these same benefits tend to the profit of many—as is evident from the Apostle's words to the Corinthians.[162] And thirdly, that those who are greater may not therefore be proud, but may realize that they need the suffrages of their inferiors.\n\n\"Father, I will that where I am they also whom Thou hast given Me may be with Me; that they may see My glory, which Thou hast given Me: because Thou hast loved Me before the foundation of the world.\"[163]", "outline": "# VII Ought We To Pray for Others?\n\n- VII\n- Ought We To Pray for Others?\n- S. James, in his Epistle, says[150]: Pray for one another that ye may be saved.\n- As we said above, we ought in prayer to ask for those things which we ought to desire\n  - But we ought to desire good things not for ourselves only but also for others, for this belongs to that charity which we ought to exercise towards our neighbour [contrast]\n  - Hence charity demands that we pray for others [consequence]\n    - In accordance with this S. Chrysostom says[151]: \"Necessity compels us to pray for ourselves, fraternal charity urges us to pray for others [restatement]\n  - But that prayer is more pleasing before God which arises not so much from our needs as from the demands of fraternal charity.\" [contrast]\n- Some, however, urge that we ought not to pray for others, thus:\n- 1. We are bound in our prayer to follow the norm which our Lord delivered to us; but in the Lord's Prayer we pray for ourselves and not for others, for we say: Give us this day our daily bread, etc.\n- But S. Cyprian says:[152] \"We do not say my Father, but our Father, neither do we say Give me, but give us; and this because the Teacher of Unity did not wish prayer to be made privately, viz., that each should pray for himself alone; for He wished one to pray for all since He in His single Person had borne all.\"\n- 2. Again, we pray in order to be heard; but one of the conditions for our prayer to be heard is that a man should pray for himself\n  - Thus on the words: If ye ask the Father anything in My Name He will give it you,[153] S. Augustine says:[154] \ r we cannot distinguish between the predestinate and the reprobate, as S. Augustine says[160]—so neither can we refuse to anyone the suffrage of our prayers. [contrast]\n- Wherefore also it is said: He that knoweth his brother to sin a sin that is not unto death, let him ask, and life shall be given to him who sinneth not to death.[159]\n- And for good men we have to pray, and this for a threefold reason: firstly, because the prayers of many are more easily heard; thus on the words: I beseech ye therefore, help me in your prayers for me,[161] the Ordinary Gloss of S. Ambrose says: \"Well does the Apostle ask his inferiors to pray for him; for even the very least become great when many in number, and when gathered together with one mind; and it is impossible that the prayers of many should not avail\" to obtain, that is, what is obtainable\n  - And secondly, that thanks may be returned by many for the benefits conferred by God upon the just, for these same benefits tend to the profit of many—as is evident from the Apostle's words to the Corinthians.[162] [restatement]\n    - And thirdly, that those who are greater may not therefore be proud, but may realize that they need the suffrages of their inferiors. [restatement]\n- \"Father, I will that where I am they also whom Thou hast given Me may be with Me; that they may see My glory, which Thou hast given Me: because Thou hast loved Me before the foundation of the world.\"[163]\n", "stats": {"coverage": 100.0, "n_inserted": 0, "nodes": 27, "max_depth": 3, "unplaced": 1, "tags": {"contrast": 4, "consequence": 2, "restatement": 5, "evidence": 2}}}, {"slug": "28-viii-ought-we-to-pray-for-our-enemies", "title": "VIII Ought We To Pray for Our Enemies?", "group": "QUESTION LXXXIII — OF PRAYER", "words": 788, "body": "VIII\n\nOught We To Pray for Our Enemies?\n\nBut I say to you ... pray for them that persecute and calumniate you.[164]\n\nTo pray for others is a work of charity, as we have said above. Hence we are bound to pray for our enemies in the same way as we are bound to love them. We have already explained, in the Treatise on Charity, in what sense we are bound to love our enemies; namely, that we are bound to love their nature, not their fault; and that to love our enemies in general is of precept; to love them, however, individually, is not of precept save in the sense of being prepared to do so; a man, for instance, is bound to be ready to love an individual enemy and to help him in case of necessity, or if he comes to seek his pardon. But absolutely to love our individual enemies, and to assist them, belongs to perfection.\n\nIn the same way, then, it is necessary that in our general prayers for others we should not exclude our enemies. But to make special prayer for them belongs to perfection and is not necessary, save in some particular cases.\n\nSome, however, argue that we ought not to pray for our enemies, thus:\n\n1. It is said in the Epistle to the Romans[165]: What things soever were written were written for our learning. But in Holy Scripture we find many imprecations against enemies; thus, for instance[166]: Let all my enemies be ashamed, let them be turned back and be ashamed very speedily. From which it would rather seem that we ought to pray against our enemies than for them.\n\nBut the imprecations which find place in Holy Scripture can be understood in four different ways: first of all according as the Prophets are wont \"to predict the future under the figure of imprecations,\" as S. Augustine says[167]; secondly, in that certain temporal evils are sometimes sent by God upon sinners for their amendment; thirdly, these denunciations may be understood, not as demanding the punishment of men themselves, but as directed against the kingdom of sin, in the sense that by men being corrected sin may be destroyed; fourthly, in that the Prophets conform their wills to the Divine Justice with regard to the damnation of sinners who persevere in their sin.\n\n2. Further, to be revenged upon our enemies means evil for our enemies. But the Saints seek to be avenged upon their enemies: How long, O Lord, dost Thou not judge and revenge our blood on them that dwell on the earth?[168] And in accordance with this we find them rejoicing in the vengeance taken upon sinners: The just shall rejoice when he shall see the revenge.[169] It would seem, then, that we ought rather to pray against our enemies than for them.\n\nBut, on the contrary, as S. Augustine says:[170] \"The vengeance of the martyrs is the overthrow of the empire of sin under whose dominion they suffered so much\"; or, as he says elsewhere[171]: \"They demand vengeance, not by word of mouth, but by very reason, just as the blood of Abel cried out from the earth.\" Moreover, they rejoice in this vengeance, not for its own sake, but because of the Divine Justice.\n\n3. Lastly, a man's deeds and his prayers cannot be in opposition. But men sometimes quite lawfully attack their enemies, else all wars would be illegal. Hence we ought not to pray for our enemies.\n\nBut it is lawful to assail our enemies that so they may be hindered from sin; and this is for their good and for that of others. In the same way, then, it is lawful to pray for temporal evils for our enemies to the end that they may be corrected. In this sense our deeds and our prayers are not in opposition.\n\nS. Augustine: If there were no wicked folk, then for whom could we be supposed to pray when we are told: Pray for your enemies? Perhaps you would like to have good enemies. Yet how could that be? For unless you yourself are bad you will not have good people for enemies; and if, on the contrary, you are good, then no one will be your enemy save the wicked folk (Sermon, xv., on Ps. xxv. 8).\n\n\"Have mercy upon us, O God of all, and behold us, and shew us the light of Thy mercies: And send Thy fear upon the nations, that have not sought after Thee: that they may know that there is no God beside Thee, and that they may shew forth Thy wonders. Lift up Thy hand over the strange nations, that they may see Thy power.\"[172]", "outline": "# VIII Ought We To Pray for Our Enemies?\n\n- VIII\n- Ought We To Pray for Our Enemies?\n- But I say to you ... pray for them that persecute and calumniate you.[164]\n- To pray for others is a work of charity, as we have said above\n  - Hence we are bound to pray for our enemies in the same way as we are bound to love them [consequence]\n    - We have already explained, in the Treatise on Charity, in what sense we are bound to love our enemies; namely, that we are bound to love their nature, not their fault; and that to love our enemies in general is of precept; to love them, however, individually, is not of precept save in the sense of being prepared to do so; a man, for instance, is bound to be ready to love an individual enemy and to help him in case of necessity, or if he comes to seek his pardon [restatement]\n  - But absolutely to love our individual enemies, and to assist them, belongs to perfection. [contrast]\n- In the same way, then, it is necessary that in our general prayers for others we should not exclude our enemies\n  - But to make special prayer for them belongs to perfection and is not necessary, save in some particular cases. [contrast]\n- Some, however, argue that we ought not to pray for our enemies, thus:\n- 1. It is said in the Epistle to the Romans[165]: What things soever were written were written for our learning\n  - But in Holy Scripture we find many imprecations against enemies; thus, for instance[166]: Let all my enemies be ashamed, let them be turned back and be ashamed very speedily [contrast]\n    - From which it would rather seem that we ought to pray against our enemies than for them. [restatement]\n- But the imprecations which find place in Holy Scripture can be understood in four different ways: first of all according as the Prophets are wont \"to predict the future under the figure of imprecations,\" as S. August re were no wicked folk, then for whom could we be supposed to pray when we are told: Pray for your enemies\n  - Perhaps you would like to have good enemies [restatement]\n  - Yet how could that be [contrast]\n  - For unless you yourself are bad you will not have good people for enemies; and if, on the contrary, you are good, then no one will be your enemy save the wicked folk (Sermon, xv., on Ps. xxv [evidence]\n- 8).\n- \"Have mercy upon us, O God of all, and behold us, and shew us the light of Thy mercies: And send Thy fear upon the nations, that have not sought after Thee: that they may know that there is no God beside Thee, and that they may shew forth Thy wonders\n  - Lift up Thy hand over the strange nations, that they may see Thy power.\"[172] [restatement]\n", "stats": {"coverage": 100.0, "n_inserted": 0, "nodes": 33, "max_depth": 4, "unplaced": 2, "tags": {"consequence": 2, "restatement": 7, "contrast": 6, "analogy": 1, "evidence": 1}}}, {"slug": "29-on-the-seven-petitions-of-the-lord-s-pra", "title": "On the Seven Petitions of the lord's Prayer.", "group": "QUESTION LXXXIII — OF PRAYER", "words": 2592, "body": "On the Seven Petitions of the lord's Prayer.\n\nThe Lord's Prayer is the most perfect of all prayers, for, as S. Augustine says to Proba[173]: \"If we pray rightly and fittingly we can say nothing else but what is set down in the Lord's Prayer.\" And since prayer is, in a sort, the interpreter of our desires before God, we can only rightly ask in prayer for those things which we can rightly desire. But in the Lord's Prayer not only do we have petitions for all those things which we can rightly desire, but they are set forth in the order in which they are to be desired. Hence this prayer not only teaches us how to pray, but serves as the norm of all our dispositions of mind.\n\nFor it is clear that we desire first the end and then the means to the attainment of that end. But our end is God, towards Whom our desires tend in two ways: first, in that we desire God's glory; secondly, in that we desire to enjoy that glory ourselves. The former of these pertains to that love wherewith we love God in Himself, the latter to that charity wherewith we love ourselves in God. Hence the first petition runs: Hallowed be Thy Name, wherein we pray for God's glory; and the second runs: Thy kingdom come, wherein we pray that we may come to the glory of His kingdom.\n\nBut to this said end things lead us in two ways: viz., either essentially or accidentally. Things which are useful for the attainment of that end essentially lead us to it. But a thing may be useful as regards that end which is the possession of God in two ways: namely, directly and principally, that is, according to the merits by which we merit the possession of God by obeying Him; and in accordance with this runs the petition: Thy Will be done on earth as it is in Heaven; also instrumentally as assisting us to merit, whence the petition: Give us this day our daily bread. And this is true whether we understand by this \"bread\" that Sacramental Bread, the daily use of Which profits man, and in Which are comprised all the other Sacraments; or whether we understand it of material bread so that \"bread\" here means all that is sufficient for the support of life—as S. Augustine explains it to Proba.[174] For both the Holy Eucharist is the chief of Sacraments, and bread is the chief of foods, whence in the Gospel of S. Matthew we have the term \"super-substantial\" or \"special\" applied to it, as S. Jerome explains it.[175]\n\nAnd we are lead, as it were, accidentally to the possession of God by the removal of impediments from our path. Now there are three things which impede us in our efforts after the possession of God. The first of these is sin, which directly excludes us from the kingdom: Neither fornicators, nor idolaters, ... etc., shall possess the kingdom of God;[176] hence the petition: Forgive us our trespasses.... And the second impediment is temptation which hinders us from obeying the Divine Will; whence the petition: And lead us not into temptation; in which petition we do not pray that we may not be tempted, but that we may not be overcome by temptation, for this is the meaning of being led into temptation. And the third hindrance lies in our present penal state which prevents us from having \"the sufficiency of life\"; and for this reason we say: Deliver us from evil.\n\nSome, however, argue that these seven petitions are not very appropriate, thus:\n\n1. It seems idle to pray that that may be hallowed which is already hallowed or holy. But the Name of God is holy: And holy is His Name.[177] Similarly, His kingdom is everlasting: Thy kingdom, O Lord, is a kingdom of all ages.[178] God's Will, too, is always fulfilled: And all My Will shall be done.[179] Hence it is idle to pray that God's Name may be hallowed, that His kingdom may come, and that His Will may be done.\n\nBut, as S. Augustine says,[180] when we say, Hallowed be Thy Name, we do not make this petition as though God's Name were not holy, but that It may be held holy by men; in other words, that God's glory may be propagated amongst men. And when we say, Thy kingdom come, it is not as though we meant that God did not reign, but, as S. Augustine says to Proba[181]: \"We stir up our desires for that kingdom, that it may come upon us and that we may reign in it.\" Lastly, when we say, Thy Will be done, this is rightly understood to mean: May Thy precepts be obeyed on earth as in Heaven—that is, as by Angels, so by men. These three petitions, then, will receive their perfect fulfilment in the life to come; but the remaining four, as S. Augustine says, refer to the necessities of the present life.[182]\n\n2. But further, to depart from evil must precede the pursuit of what is good. Hence it hardly seems appropriate to place those petitions which are concerned with the pursuit of what is good before those which refer to the departing from evil.\n\nYet since prayer is the interpreter of our desires the order of these petitions does not correspond to the order of attainment but of desire or intention; in this order, however, the end precedes the means to the end, the pursuit of good comes before the departure from evil.\n\n3. But once more, we ask for something in order that it may be given us. But the chief gift of God is the Holy Spirit and those things which are given us through Him. Hence these petitions do not seem to be very appropriate since they do not correspond to the Gifts of the Holy Spirit.\n\nS. Augustine[183], however, adapts these seven petitions to the Gifts of the Holy Spirit and to the Beatitudes; he says: \"If we have the fear of God by which the poor in spirit are blessed, we pray that God's Name may be hallowed among men by chaste fear. If we have piety, by which the meek are blessed, we pray that His kingdom may come, that we may be meek, and that we may not withstand It. If we have knowledge, by which they that mourn are blessed, we pray that His will may be done, and that so we may not mourn. If we have fortitude, by which they that hunger are blessed, we pray that our daily bread may be given us. If we have counsel, by which they that are merciful are blessed, let us forgive our debtors that we ourselves may be forgiven. If we have understanding, by which the clean of heart are blessed, let us pray that we may not have a double heart that pursues after temporal things whence temptations come to us. If we have wisdom, whence the peace-makers are blessed—for they shall be called the sons of God—let us pray that we may be delivered from evil, for that very deliverance will make us the free sons of God.\"\n\n4. Again, according to S. Luke,[184] there are only five petitions in the Lord's Prayer. Hence it would seem superfluous to have seven in S. Matthew.\n\nBut, as S. Augustine says[185]: \"S. Luke only includes five petitions and not seven in the Lord's Prayer, for he shows that the third petition is, in a sense, only a repetition of the two preceding ones; by omitting it he makes us see that God's will is more especially concerned with our knowledge of His sanctity and with our reigning with Him. But Luke has omitted Matthew's last petition, Deliver us from evil, in order to show us that we are delivered from evil just precisely as we are not led into temptation.\"\n\n5. And lastly, it seems idle to try to stir up the benevolence of one who is beforehand with his benevolence. But God does forestall us with His benevolence, for He hath first loved us.[186] Consequently it seems superfluous to preface our petitions with the words Our Father Who art in Heaven, words which seem intended to stir up God's benevolence.\n\nBut we must remember that prayer is not directed to God in order to prevail upon Him, but in order to excite ourselves to confidence in our petitions. And this confidence is especially excited in us by consideration of His love towards us whereby He wishes us well, wherefore we say, Our Father; and of His pre-eminent power whereby He is able to assist us, whence we say, Who art in Heaven.\n\nCajetan: The first three petitions of the Lord's Prayer can also be referred to that which we principally desire, so that all three regard mainly that love wherewith we love God in Himself, and secondarily that love wherewith we love ourselves in God. And the proof of this is that in each of the first three we have the pronoun Thine, but in the last four the pronoun our. Thus the first petition asks for the effective and enduring praise of God's Name; the second, that He—and not the devil, nor the world, nor the flesh, nor sin—may reign effectively; the third, that His Will may be effectively fulfilled. For these things are not now absolutely so with God, and this by reason of the multitude of sins, and also because the mode of their present fulfilment is hidden. And the word effectively is introduced into each clause by reason of the subjoined qualification on earth as it is in Heaven, for this qualifies each of the foregoing clauses. Hence rightly do our desires first of all aim at, wish for, and pray that—even as something good for God Himself—He may be sanctified in His Name; that He may be permanently uplifted above all things—on earth as in Heaven; that He—not sin—may reign—on earth as in Heaven; that His Will—none other—may be done—on earth as in Heaven (on 2. 2. 83. 9).\n\nS. Augustine: O Eternal Truth, True Love and lovable Eternity! Thou art my God; for Thee do I sigh night and day! And when I first knew Thee Thou didst snatch me up so that I saw that That really was Which I saw, and that I who saw was really not—as yet. And Thou didst beat back my weak gaze, pouring out Thy light upon me in its intensity; and I trembled with love and with horror. For I found myself to be far away from Thee in a land that was unlike Thee; it was as though I heard Thy Voice from on high, saying: \"I am the Food of grown men, grow, and thou shalt eat Me, but thou shalt not be changed into Me\" (Confessions, VII. x. 2).\n\nS. Augustine: And the faithful are well aware of that Spiritual Food Which you, too, will soon know and Which you are to receive from God's altar. It will be your food, nay, your daily food, needful for this life. For are we not about to receive the Eucharist wherein we come to Christ Himself, and begin to reign with Him for ever? The Eucharist is our daily Bread. But let us so receive it as to be thereby refreshed, not in body merely but in mind. For the power which we know to be therein is the power of Unity whereby we are brought into union with His Body and become His members. Let us be What we receive; for then It will be truly our daily bread.\n\nAgain, what I set before you is your daily bread; and what you hear read day by day in the church is your daily bread; and the hymns you hear and which you sing—they are your daily bread. For these things we need for our pilgrimage. But when we get There are we going to hear a book read? Nay, we are going to hear the Word Himself; we are going to see the Word Himself; we are going to eat Him, to drink Him, even as the Angels do already. Do the Angels need books, or disputations, or readers? Nay, not so. But by seeing they read, for they see the Truth Itself and are sated from that Fount whence we receive but the sprinkling of the dew (Sermon, lvii., on S. Matt. vi. 7).\n\nS. Augustine: When ye say Give us this day our daily bread, ye profess yourselves God's beggars. Yet blush not at it! The richest man on earth is God's beggar. The beggar stands at the rich man's door. But the rich man in his turn stands at the door of one richer than he. He is begged from, and he, too, has to beg. If he were not in need he would not beseech God in prayer. But what can the rich man need? I dare to say it: he needs even his daily bread! For how is it that he abounds with all things, save that God gave them to him? And what will they have if God but withdraw His hand? (Sermon, lvi. 9, on S. Matt. vi.).\n\nS. Augustine: Think not that you have no need to say Forgive us our trespasses as we forgive them that trespass against us.... He who looks with pleasure at what he should not—sins. Yet who can control the glance of the eye? Indeed, some say that the eye is so called from its swiftness (oculus a velocitate). Who can control his eyes or his ears? You can close your eyes when you like, but how quickly they open again! You can shut your ears with an effort; put up your hand, and you can touch them. But if someone holds your hands your ears remain open, and you cannot then shut out cursing words, impure words, flattering and deceitful words. When you hear something which you should not—do you not sin with your ears? What when you hear some evil thing with pleasure? And the death-dealing tongue! How many sins it commits! (Sermon, lvi. 8).\n\nS. Augustine: Indeed, our whole righteousness—true righteousness though it be, by reason of the True Good to Whom it is referred, consists rather, as long as we are in this life, in the remission of our sins than in the perfection of our virtues. And the proof of this is the Prayer of the whole City of God which is in pilgrimage on this earth. For by all Its members It cries to God: Forgive us our trespasses as we forgive them the trespass against us! And this Prayer is of no avail for those whose faith is without works—dead; but only for those whose faith worketh through charity. For though our reason is indeed subject to God, yet in this our mortal condition, in this corruptible body which weigheth down the soul, our reason does not perfectly control our vices, and hence such prayer as this is needful for the righteous (Of the City of God, xix. 27).\n\n\"Father, the hour is come; glorify Thy Son, that Thy Son may glorify Thee. As Thou hast given Him power over all flesh, that He may give life everlasting to all whom Thou hast given Him. And this is life everlasting, that they may know Thee, the only true God, and Jesus Christ, Whom Thou hast sent.\"[187]", "outline": "# On the Seven Petitions of the lord's Prayer.\n\n- On the Seven Petitions of the lord's Prayer.\n- The Lord's Prayer is the most perfect of all prayers, for, as S. Augustine says to Proba[173]: \"If we pray rightly and fittingly we can say nothing else but what is set down in the Lord's Prayer\n  - And since prayer is, in a sort, the interpreter of our desires before God, we can only rightly ask in prayer for those things which we can rightly desire [restatement]\n  - But in the Lord's Prayer not only do we have petitions for all those things which we can rightly desire, but they are set forth in the order in which they are to be desired [contrast]\n  - Hence this prayer not only teaches us how to pray, but serves as the norm of all our dispositions of mind. [consequence]\n- For it is clear that we desire first the end and then the means to the attainment of that end\n  - But our end is God, towards Wh way as a command is an act of the reason by which an inferior is directed to do something. Prayer, then, properly pertains to one who has the use of reason and who also has a superior with whom he can plead. The Persons of the Trinity have no superior; the brute animals have no reason. Hence prayer belongs neither to the Divine Persons nor to the brute creation, but is peculiar to rational creatures.\n\nSome, however, argue that prayer cannot be peculiar to rational creatures, thus:\n\n1. To ask and to receive belong to the same person. But the Divine Persons receive: the Son, namely, and the Holy Spirit. Consequently They can also pray; indeed it is the Son Himself Who says, I will ask the Father,[189] and the Apostle says of the Holy Spirit, The Spirit Himself asketh for us.[190]\n\nBut it belongs to the Divine Persons to receive by Their nature, whereas to pray belongs to one who receives through grace. The Son is said to ask or pray according to the nature He took upon Himself—that is according to His Human, and not according to His Divine, Nature; the Holy Spirit, too, is said to petition because He makes us petition.\n\n2. But further, the Angels are superior to the rational creation since they are intellectual substances; but it belongs to the Angels to pray, for it is said in the Psalm[191]: Adore Him, all ye His Angels.\n\nBut the intellect and the reason are not different faculties in us, though they do differ in the sense that one is more perfect than the other. Consequently the intellectual creation, such as are the Angels, is sometimes distinguished from the rational creation, but at other times both are embraced under the one term \"rational.\" And it is in this latter sense of the term \"rational\" that prayer is said to be peculiar to the rational creation.\n\n3. Lastly, he prays who calls upon God; for it is chiefly by prayer that we call upon God. But the brute animals also call upon God, for the Psalmist says: Who giveth to beasts their food, and to the young ravens that call upon Him.[192]\n\nBut the young ravens are said to call upon God by reason of those natural desires by which all things, each in their own fashion, desire to obtain the Divine goodness. In the same way brute animals are said to obey God by reason of the natural instinct by which they are moved by God.\n\n\"Reward them that patiently wait for Thee, that Thy Prophets may be found faithful: and hear the prayers of Thy servants. According to the blessing of Aaron over Thy people, and direct us into the way of justice, and let all know that dwell upon the earth, that Thou art God the beholder of all ages.\"[193]", "outline": "# X Is Prayer Peculiar to Rational Creatures?\n\n- X\n- Is Prayer Peculiar to Rational Creatures?\n- Prayer is an act of the reason, as we have shown above\n  - And rational creatures are so termed because of the possession of reason [restatement]\n  - Consequently prayer is peculiar to them. [consequence]\n- As we have said above, prayer is an act of the reason by which a person pleads with his superior, just in the same way as a command is an act of the reason by which an inferior is directed to do something\n  - Prayer, then, properly pertains to one who has the use of reason and who also has a superior with whom he can plead [restatement]\n    - The Persons of the Trinity have no superior; the brute animals have no reason [restatement]\n  - Hence prayer belongs neither to the Divine Persons nor to the brute creation, but is peculiar to rational creatures. [consequence]\n- Some, however, argue that prayer cannot be peculiar to rational creatures, thus:\n- 1. To ask and to receive belong to the same person\n  - But the Divine Persons receive: the Son, namely, and the Holy Spirit [contrast]\n  - Consequently They can also pray; indeed it is the Son Himself Who says, I will ask the Father,[189] and the Apostle says of the Holy Spirit, The Spirit Himself asketh for us.[190] [consequence]\n- But it belongs to the Divine Persons to receive by Their nature, whereas to pray belongs to one who receives through grace\n  - The Son is said to ask or pray according to the nature He took upon Himself—that is according to His Human, and not according to His Divine, Nature; the Holy Spirit, too, is said to petition because He makes us petition. [restatement]\n- 2. But further, the Angels are superior to the rational creation since they are intellectual substances; but it belongs to the Angels to pray, for it is said in the Psalm[191]: Adore Him, all ye His Angels.\n- But the intellect and the reason are not different faculties in us, though they do differ in the sense that one is more perfect than the other\n  - Consequently the intellectual creation, such as are the Angels, is sometimes distinguished from the rational creation, but at other times both are embraced under the one term \"rational [consequence]\n    - And it is in this latter sense of the term \"rational\" that prayer is said to be peculiar to the rational creation. [restatement]\n- 3. Lastly, he prays who calls upon God; for it is chiefly by prayer that we call upon God\n  - But the brute animals also call upon God, for the Psalmist says: Who giveth to beasts their food, and to the young ravens that call upon Him.[192] [contrast]\n- But the young ravens are said to call upon God by reason of those natural desires by which all things, each in their own fashion, desire to obtain the Divine goodness\n  - In the same way brute animals are said to obey God by reason of the natural instinct by which they are moved by God. [analogy]\n- \"Reward them that patiently wait for Thee, that Thy Prophets may be found faithful: and hear the prayers of Thy servants\n- According to the blessing of Aaron over Thy people, and direct us into the way of justice, and let all know that dwell upon the earth, that Thou art God the beholder of all ages.\"[193]\n", "stats": {"coverage": 100.0, "n_inserted": 0, "nodes": 25, "max_depth": 3, "unplaced": 1, "tags": {"restatement": 5, "consequence": 4, "contrast": 2, "analogy": 1}}}, {"slug": "32-xi-do-the-saints-in-heaven-pray-for-us", "title": "XI Do the Saints in Heaven Pray for Us?", "group": "QUESTION LXXXIII — OF PRAYER", "words": 1054, "body": "XI\n\nDo the Saints in Heaven Pray for Us?\n\nThis is he who prayeth much for the people and for all the holy city, Jeremias the Prophet of God.[194]\n\nAs S. Jerome says,[195] Vigilantius's error lay in maintaining that \"while we live we can mutually pray for one another; but after we are dead no one's prayer for another is heard, and this is especially clear in the case of the Martyrs who were unable to obtain by their prayers vengeance for their blood.\"\n\nBut this is altogether false; for since prayer for others springs from charity, the more perfect the charity of those who are in Heaven the more they pray for those wayfarers on earth who can be helped by their prayers. And the more knit they are to God the more efficacious are their prayers; for the Divine harmony demands that the superabundance of those who are in the higher position should redound upon those who are lower, just as the brightness of the sun renders the atmosphere itself luminous. Whence Christ Himself is said to be Approaching of Himself to God to intercede for us.[196] Whence, too, S. Jerome's reply to Vigilantius: \"If the Apostles and Martyrs, when they were still in the body, and had still to be solicitous on their own account, prayed for others, how much more when they have won the crown, when they have gained the victory and the triumph?\"\n\nYet some maintain that the Blessed in Heaven do not pray for us, thus:\n\n1. A man's acts are more meritorious for himself than for another. But the Saints who are in Heaven neither merit for themselves nor pray for themselves, for they have already attained the goal of their desires. Hence neither do they pray for us.\n\nBut the Saints who are in our Fatherland lack no Blessedness—since they are Blessed—save the glory of the body, and for this they pray. But they pray for us who still lack the ultimate perfection of Blessedness; and their prayers are efficacious by reason of their previous merits and of the Divine acceptation of their prayers.\n\n2. But once more: the Saints are perfectly conformed to the Will of God, and consequently will nothing but what He wills. But what God wills is always fulfilled. Hence it is idle for the Saints to pray for us.\n\nBut the Saints obtain that which God wills should come about through the medium of their prayers; and they ask for what they think is, by God's Will, to be fulfilled through their prayers.\n\n3. And yet again: just as the Saints in Heaven are superior to us so also are they who are in Purgatory—for they cannot sin. Those, however, who are in Purgatory do not pray for us, but rather we for them. It follows, then, that neither can the Saints in Heaven pray for us.\n\nBut though those who are in Purgatory are superior to us in that they cannot sin, yet are they our inferiors as regards the penalties they suffer; hence they are not in a state to pray for us, but rather we for them.\n\n4. Once more: if the Saints in Heaven could pray for us it would follow that the prayers of the holiest Saints would be the most efficacious, and that consequently we ought not to ask the inferior Saints to pray for us, but only the greatest ones.\n\nBut God desires inferior things to be helped by all that are superior, and consequently we have to implore the aid of not only the chief Saints but also of the lesser; else it would follow that we ought to implore mercy from God alone. And it may sometimes happen that the petition made to a lesser Saint is more efficacious, either because we ask him more devoutly, or because God wishes thus to show forth his sanctity.\n\n5. Lastly, Peter's soul is not Peter. Consequently if the souls of the Saints could pray for us, we ought—as long as their souls are separated from their bodies—to appeal, not to Peter to help us, but to Peter's soul; whereas the Church does the contrary. From which it would seem that the Saints, at all events previous to the Resurrection, do not pray for us.\n\nBut since the Saints merited when alive that they should pray for us, we therefore call upon them by the names they bore when here below, and by which they are best known to us; and we do this, too, in order to show our faith in the Resurrection, in accordance with the words I am the God of Abraham.[197]\n\nCajetan: The question arises: how could Jeremias, who in the days of the Maccabees was not yet in our Fatherland but still in the Limbo of the Fathers, pray for Jerusalem?\n\nBut if we carefully consider what it is at root which makes the prayers of the Saints in the Fatherland avail for us, we shall find that the same reason holds for the Saints who were in Limbo as for those who enjoy the Beatific Vision. For it is their charity in their state of absolute superiority to us which is the reason for their praying for us. Hence, in the reply to the third difficulty, those who are in Purgatory are excluded from the number of those who pray for us because they are not altogether our superiors, but by reason of their sufferings are inferior to us, and need our prayers.\n\nBut the Fathers in Limbo were, it is clear, confirmed in charity and were incapable of sin, neither were they liable to any peculiar or fresh suffering. For while the pain of loss was common to them and to the sojourners on earth, the former were free from all pain of sense, hence they could pray for us. There is, however, this difference to be noted between them and the Saints in the Fatherland—viz., that whereas the former had it in common with the latter to pray for those sojourning on earth, it is given only to the Saints in the Fatherland to see the prayers of us sojourners addressed to them. Hence Jeremias is here said to pray, he is not said to have heard their prayers or supplications (on 2. 2. 83. 11)." devotion without such incentives. Thus the Psalmist says: My heart hath said to Thee, My face hath sought Thee[200]; and of Anna we are told that she spoke within her heart.[201]\n\nAnd secondly, we make use of vocal prayer in payment, as it were, of a just debt—in order, that is, to serve God with the entirety of what we have received from Him; consequently not with our mind alone but with our body as well; and this, as the Prophet Osee says, is especially suitable to prayer considered as a satisfaction for our sins: Take away all iniquity and receive the good, and we will render the calves of our lips.[202]\n\nAnd thirdly, we sometimes make use of vocal prayer because the soul overflows, as it were, on to the body by reason of the vehemence of our feelings, as it is written: My heart hath been glad, and my tongue hath rejoiced.[203]\n\nBut it seems to some that prayer should not be vocal, thus:\n\n1. Prayer is, as we have said, principally directed to God, and God knows the heart's speech. Consequently to add vocal prayer is idle.\n\nBut vocal prayer is not employed in order to manifest to God something which He did not know, but to stir up the mind of him who prays, and of others, too, towards God.\n\n2. Again, man's mind is meant to rise by prayer towards God; but words, and other things pertaining to the senses, keep back a man from the ascent of contemplation.\n\nWords appertaining to other things than God do indeed distract the mind and hinder the devotion of him who prays; but devotional words stir up the mind, especially if it be less devout.\n\n3. Lastly, prayer ought to be offered to God in secret, according to the words: But thou when thou shalt pray, enter into thy chamber, and having shut the door, pray to thy Father in secret;[204] whereas to pray vocally means to publish it abroad.\n\nBut, as S. Chrysostom says[205]: \"The Lord forbade us to pray in public with a view to being seen by the public. Consequently, when we pray we should do nothing novel to attract men's attention, whether by uttering cries which may be heard by them, or by openly beating our breasts, or by spreading out our hands, for the crowd to see us.\" While, on the other hand, as S. Augustine remarks[206]: \"To be seen by men is not wrong, but to do things to be seen by men.\"\n\nCajetan: Note carefully, ye who murmur at the Church's services, these three points: the different kinds of vocal prayer, its necessity, and the conditions attaching to it. For vocal prayer is divided into that which is in common and that which is private or individual.\n\nThe general necessity of vocal prayer arises from the fact that it is offered in the person of the Church. For since the Church is composed of created beings dependent on the senses, prayer made through the medium of the senses—i.e., vocal prayer—must needs be offered by its ministers; else we should not know whether the worship of prayer was being offered by God's ministers, nor should we be conscious of the gift to God which was being offered by them in prayer; for the Church only judges from the things that appear externally.\n\nOur individual need of vocal prayer arises from the necessity of stirring up our own devotion, and preserving it.\n\nThe conditions of prayer in common are twofold: it must be vocal, and it must be out loud. Hence those who say private Masses in such a low tone—and that consciously—as to be unintelligible to their hearers, appear to act unreasonably and are inexcusable, unless it should happen by accident that no one is present; in this case it is sufficient if they can be heard by the server who is close at hand. This will also show us what use we are to make of chant, or of recitation without chant, in prayer in common: it must be governed by our common devotion. And in whatever fashion such prayer may be made this rule must always be observed: it must be said so intelligibly that the meaning of the words may be distinctly perceived both by the reciters and by others, that so the Church's devotion may be aroused.\n\nAnd reason tells us what conditions attach to our private prayer: viz., our own private devotion. This shews, too, the error of those who, in order to complete the tale of a large number of private vocal prayers each day, lay aside meditation and mental prayer. They neglect the end for the means (on 2. 2. 83. 12).\n\nS. Augustine: Oh! How I lifted up my voice to Thee, O Lord, when I sang the Psalms of David, those songs full of faith, those strains full of piety which soothed my swelling spirit! And I was then but uninstructed in Thy true love; a catechumen spending my leisure with Alypius, another catechumen. And my mother stayed with us: clad indeed in woman's garb, but with a man's faith, with a matron's calm, with a mother's love, with a Christian's piety. Oh! How I lifted up my voice in those Psalms! How they inflamed my heart! How I yearned to recite them, if I could, to the whole world—as an answer to the pride of the human race! Though, indeed, they are sung throughout the world, and none can hide himself from Thy heat! (Confess., IX. iv. 8).\n\nS. Augustine: Sometimes, indeed, through immoderate fear of this mistake I err by excessive severity; nay, sometimes, though it is but rarely, I could almost wish to shut out from my ears and even from the Church itself all those sweet-sounding melodies used in the accompaniment of David's Psalms. Sometimes it seems to me as though it would be safer to do as I have often heard that Athanasius, the Bishop of Alexandria, did, for he made the reader of the Psalms so modulate his voice that he came to be rather speaking than singing. Yet, on the other hand, when I remember the tears which I shed when I heard the Church's chant in the early days of my regaining the faith, and when I notice that even now I am stirred—not so much by the chant as by the things that are chanted—when, that is, they are chanted with clear intonation and suitable modulation, then once more I recognize the great value of this appointed fashion (Confess., X. xxxiii. 50).\n\nS. Augustine: I have cried with my whole heart, hear me, O Lord![207] Who can question but that when men pray their cry to the Lord is vain if it be nought but the sound of the corporeal voice and their heart be not intent upon God? But if their prayer come from the heart, then, even though the voice of the body be silent, it may be hidden from all men, yet not from God. Whether, then, we pray to God with our voice—at times when such prayer is necessary—or whether we pray in silence, it is our heart that must send forth the cry. But the heart's cry is the earnest application of our minds. And when this accompanies our prayer it expresses the deep affections of him who yearns and asks and so despairs not of his request. And further, a man cries with his whole heart when he has no other thought. Such prayers with many are rare; with few are they frequent; I know not whether anyone's prayers are always so (Enarr. in Ps. cxviii., Sermon, xxix. 1).\n\n\"Incline Thy ear, O Lord, and hear me; for I am needy and poor. Preserve my soul, for I am holy: save Thy servant, O my God, that trusteth in Thee. Have mercy on me, O Lord, for I have cried to Thee all the day. Give joy to the soul of Thy servant, for to Thee, O Lord, I have lifted up my soul. For Thou, O Lord, art sweet and mild; and plenteous in mercy to all that call upon Thee.\"[208]", "outline": "# XII Should Prayer be Vocal?\n\n- XII\n- Should Prayer be Vocal?\n- I cried to the Lord with my voice, with my voice I made supplication to the Lord.[198]\n- Prayer is of two kinds: public and private\n  - Public or common prayer is that which is offered to God by the Church's ministers in the person of the whole body of the faithful [restatement]\n    - And it is necessary that such prayer should be known to the body of the faithful for whom it is offered; this, however, could not be unless it were vocal; consequently it is reasonably enacted that the Church's ministers should pronounce such prayers in a loud voice so as to reach the ears of all. [restatement]\n- Private prayer, on the contrary, is that which is offered by private individuals, whether for themselves or for others; and its nature does not demand that it should be vocal\n  - At the same time, we can use our voices in this kind of prayer, and this for three reasons: Firstly, in order to excite interior devotion whereby our minds may, when we pray, be lifted up to God; for men's minds are moved by external signs—whether words or acts—to understand, and, by consequence, also to feel [contrast]\n    - Wherefore S. Augustine says to Proba[199]: \"By words and other signs we vehemently stir ourselves up so as to increase our holy desires [restatement]\n  - Hence in private prayer we must make such use of words and other signs as shall avail to rouse our minds interiorly [consequence]\n  - But if, on the other hand, such things only serve to distract the mind, or prove in any way a hindrance, then we must cease from them; this is especially the case with those whose minds are sufficiently prepared for devotion without such incentives [contrast]\n  - Thus the Psalmist says: My heart hath said to Thee, My face hath sought Thee[200]; and of Anna we are told that she spoke within her heart.[201] [consequence]\n- And secondly, we make use of vocal prayer in payment, as it were, of a just debt—in order, that is, to serve God with the entirety of what we have received from Him; consequently not with our mind alone but with our body as well; and this, as the Prophet Osee says, is especially suitable to prayer considered as a satisfaction for our sins: Take away all iniquity and receive the good, and we will render the calves of our lips.[202]\n- And thirdly, we sometimes make use of vocal prayer because the soul overflows, as it were, on to the body by reason of the vehemence of our feelings, as it is written: My heart hath been glad, and my tongue hath rejoiced.[203]\n- But it seems to some that prayer should not be vocal, thus:\n- 1. Prayer is, as we have said, principally directed to God, and God knows the heart's speech\n  - Consequently to add vocal prayer is idle. [consequence]\n- But vocal prayer is not employed in order to manifest to God something which He did not know, but to stir up the mind of him who prays, and of others, too, towards God.\n- 2. Again, man's mind is meant to rise by prayer towards God; but words, and other things pertaining to the senses, keep back a man from the ascent of contemplation.\n- Words appertaining to other things than God do indeed distract the mind and hinder the devotion of him who prays; but devotional words stir up the mind, especially if it be less devout.\n- 3. Lastly, prayer ought to be offered to God in secret, according to the words: But thou when thou shalt pray, enter into thy chamber, and having shut the door, pray to thy Father in secret;[204] whereas to pray vocally means to publish it abroad.\n- But, as S. Chrysostom says[205]: \"The Lord forbade us to pray in public with a view to being seen by the public\n  - Consequently, when we pray we should do nothing novel to attract men's attention, whether by uttering cries which may be heard by them, or by openly beating our breasts, or by spreading out our hands, for the crowd to see us [consequence]\n  - While, on the other hand, as S. Augustine remarks[206]: \"To be seen by men is not wrong, but to do things to be seen by men.\" [contrast]\n- Cajetan: Note carefully, ye who murmur at the Church's services, these three points: the different kinds of vocal prayer, its necessity, and the conditions attaching to it\n  - For vocal prayer is divided into that which is in common and that which is private or individual. [evidence]\n- The general necessity of vocal prayer arises from the fact that it is offered in the person of the Church\n  - For since the Church is composed of created beings dependent on the senses, prayer
