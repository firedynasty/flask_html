. Now the effect or object of prayer is threefold. Its first effect—an effect, indeed, which is common to all acts springing from charity—is merit; but to secure this effect it is not necessarily required that attention should be kept up throughout the prayer, but the initial intention with which a man comes to prayer renders the whole prayer meritorious, as, indeed, is the case in all other meritorious acts.\n\nThe second effect of prayer is peculiar to it, and that is to obtain favours; and for this, too, the primary intention suffices, and to it God principally looks. But if the primary intention is wanting, prayer is not meritorious, neither can it win favours; for, as S. Gregory says, God hears not the prayer of a man who when he prays does not give heed to God.[210]\n\nThe third effect of prayer is that which it immediately and actually brings about, namely, the spiritual refreshment of the soul; and to attain this end attention is necessarily required in prayer. Whence it is said, If I pray in a tongue my understanding is without fruit.[211]\n\nAt the same time, we must remember that there is a threefold species of attention which may find place in our vocal prayer: one by which a man attends to the words he recites, and is careful to make no mistake in them; another by which he attends to the meaning of the words; and a third by which he attends to the end of all prayer—namely, God Himself—and to the object for which he is praying. And this species of attention is the most necessary of all, and one which even uninstructed folk can have; sometimes, indeed, the intensity with which the mind is borne towards God is, as says Hugh of S. Victor, so overwhelming that the mind is oblivious of all else.[212]\n\nSome, however, argue that prayer must of necessity be attentive, thus:\n\n1. It is said in S. John's Gospel[213]: God is a spirit, and they that adore Him must adore Him in spirit and truth. But inattentive prayer is not in spirit.\n\nBut he prays in spirit and in truth who comes to pray moved by the impulse of the Spirit, even though, owing to human infirmity, his mind afterwards wanders.\n\n2. But again, prayer is \"the ascent of the mind towards God.\" But when prayer is inattentive the mind does not ascend towards God.\n\nBut the human mind cannot, owing to Nature's weakness, long remain on high, for the soul is dragged down to lower things by the weight of human infirmity; and hence it happens that when the mind of one who prays ascends towards God in contemplation it suddenly wanders away from Him owing to his infirmity.\n\n3. Lastly, prayer must needs be without sin. But not without sin does a man suffer distraction of mind when he prays, for he seems to mock God, just as if one were to speak with his fellow-man and not attend to what he said. Consequently S. Basil says[214]: \"The Divine assistance is to be implored, not remissly, nor with a mind that wanders here and there; for such a one not only will not obtain what he asks, but will rather be mocking God.\"\n\nOf course, if a man purposely allowed his mind to wander in prayer, he would commit a sin and hinder the fruit of his prayer. Against such S. Augustine says in his Rule[215]: \"When you pray to God in Psalms and hymns, entertain your heart with what your lips are reciting.\" But that distraction of mind which is unintentional does not destroy the fruit of prayer.\n\nHence S. Basil also says: \"But if through the weakness of sinful nature you cannot pray with attention, restrain your imagination as far as you can, and God will pardon you, inasmuch as it is not from negligence but from weakness that you are unable to occupy yourself with Him as you should.\"\n\nCajetan: Does a man satisfy the precept of the Church if, being bound to the recitation of the Divine Office, he sets out with the intention of meditating upon the Divine Goodness or upon the Passion of Christ, and thus keeping his mind firmly fixed upon God? Clearly a man who strives to keep his mind occupied during the whole of the Divine Office with contemplation of and devout affections towards God and Divine things fully satisfies his obligation. So, too, a man who aims at meditation on the Passion of Christ and devout affections on it during the whole Office, undoubtedly satisfies his obligation, for he is making use of a better means for keeping in touch with the Divinity than if he merely dwelt upon the meaning of the words. At the same time, he must be ready to lay this aside if in the course of the Office he finds himself uplifted to Divine things, for at this he must primarily aim. One who so prays, then, must make the Passion of Christ a means and not an end; he must, that is, be prepared to ascend thereby, if God grants it, to Divine things. In short, we may make use of any one of the species of attention enumerated above provided we do not exclude the higher forms. Thus, for example, if a man feels that it is more suited to his small capacity to aim simply at making no mistakes, and habitually makes use of this form of attention, he must still use it as a means only; he must, that is, be at God's disposition, for God may have mercy upon him and grant him, by reason of his dispositions, some better form of attention.\n\nAgain, when a person prays for things needful for his support in life he must not be so occupied with the thought of these things as to appear to subordinate Divine things to human, as though prayer was but a means and his daily living the end. We must bear in mind the doctrine laid down above[216]—viz., that all our prayers should tend to the attainment of grace and glory. We must occupy ourselves with the thought of eternal glory, or of the glory of the adoption of sons during this life, or with the virtues as means to arriving at our eternal home, and as the adornment of the inhabitants of heaven, and the commencement here of heavenly \"conversation\"; such things as these must be counted as the highest forms of attention (on 2. 2. 83. 13).\n\nS. Augustine: Give joy to the soul of Thy servant, for to Thee, O Lord, I have lifted up my soul. For Thou, O Lord, art sweet and mild.[217] It seems to me that he calls God \"mild\" because He endures all our vagaries, and only awaits our prayers that He may perfect us. And when we offer Him our prayers He accepts them gratefully and hears them. Neither does He reflect on the careless way in which we pour them out, He even accepts prayers of which we are hardly conscious! For, Brethren, what man is there who would put up with it if a friend of his began a conversation with him, and yet, just when he was ready to reply to what his friend said, should discover that he was paying no attention to him but was saying something to someone else? Or supposing you were to appeal to a judge and were to appoint a place for him to hear your appeal, and then suddenly, while you were talking with him, were to put him aside and begin to gossip with a friend! How long would he put up with you? And yet God puts up with the hearts of so many who pray to Him and who yet are thinking of other things, even evil things, even wicked things, things hateful to God; for even to think of unnecessary things is an insult to Him with Whom you have begun to talk. For your prayer is a conversation with God. When you read, God speaks to you; when you pray, you speak to God.... And you may picture God saying to you: \"You forget how often you have stood before Me and have thought of such idle and superfluous things and have so rarely poured out to Me an attentive and definite prayer!\" But Thou, O Lord, art sweet and mild! Thou art sweet, bearing with me! It is from weakness that I slip away! Heal me and I shall stand; strengthen me and I shall be firm! But until Thou dost so, bear with me, for Thou, O Lord, art sweet and mild (Enarr. in Ps. lxxxv. 7).\n\nS. Augustine: Praise the Lord, O my soul![218] What mean these words, Brethren? Do we not praise the Lord? Do we not sing hymns day by day? Do not our mouths, each according to their measure, sound forth day by day the praises of God? And what is it we praise? It is a great Thing that we praise, but that wherewith we praise is weak as yet. When does the singer fill up the praises of Him Whom he sings? A man stands and sings before God, often for a long space; but oftentimes, whilst his lips move to frame the words of his song, his thoughts fly away to I know not what desires! And so, too, our mind has sometimes been fixed on praising God in a definite manner, but our soul has flitted away, led hither and thither by divers desires and anxious cares. And then our mind, as though from up above, has looked down upon the soul as it flitted to and fro, and has seemed to turn to it and address its uneasy wanderings—saying to it: Praise the Lord, O my soul! Why art thou anxious about other things than Him? Why busy thyself with the mortal things of earth? And then our soul, as though weighed down and unable to stand firm as it should, replies to our mind: I will praise the Lord in my life! Why does it say in my life? Why? Because now I am in my death!\n\nRouse yourself, then, and say: Praise the Lord, O my soul! And your soul will reply to you: \"I praise Him as much as I can, though it is but weakly, in small measure, and with little strength.\" But why so? Because while we are in the body we are absent from the Lord.[219] And why do you thus praise the Lord so imperfectly and with so little fixity of attention? Ask Holy Scripture: The corruptible body weigheth down the soul, and the earthly habitation presseth down the mind that museth upon many things.[220] O take away, then, my body which weigheth down the soul, and then will I praise the Lord! Take away my earthly habitation which presseth down the mind that museth upon many things, so that, instead of many things I may be occupied with One Thing alone, and may praise the Lord! But as long as I am as I am, I cannot, for I am weighed down! What then? Wilt thou be silent? Wilt thou never perfectly praise the Lord? I will praise the Lord in my life! (Enarr in Ps. cxlv. 1).\n\n\"My spirit is in anguish within me; my heart within me is troubled. I remembered the days of old, I meditated on all Thy works; I meditated upon the works of Thy hands. I stretched forth my hands to Thee; my soul is as earth without water unto Thee. Hear me speedily, O Lord: my spirit hath fainted away.\"[221]\n\nS. Thomas: The fruits of prayer are twofold. For first there is the merit which thereby accrues to a man; and, secondly, there is the spiritual consolation and devotion which is begotten of prayer. And he who does not attend to, or does not understand his prayer, loses that fruit which is spiritual consolation; but we cannot say that he loses that fruit which is merit, for then we should have to say that very many prayers were without merit since a man can hardly say the Lord's Prayer without some distraction of mind. Hence we must rather say that when a person is praying and is sometimes distracted from what he is saying, or—more generally—when a person is occupied with some meritorious work and does not continuously and at every moment reflect that he is doing it for God, his work does not cease to be meritorious. And the reason is that in meritorious acts directed to a right end it is not requisite that our intention should be referred to that end at every moment, but the influence of the intention with which we begun persists throughout even though we now and again be distracted in some particular point; and the influence of this initial intention renders the whole body of what we do meritorious unless it be broken off by reason of some contrary affection intruding itself and diverting us from the end we had first in view to some other end contrary to it.\n\nAnd it must be remembered that there are three kinds of attention. The first is attention to the words we are actually saying; and sometimes this is harmful, for it may hinder devotion. The second is attention to the meaning of the words, and this, too, may be harmful, though not gravely so. The third is attention to the goal of our prayer, and this better and almost necessary (Commentary on 1 Cor. xiv. 14).", "outline": "# XIII Must Prayer necessarily be Attentive?\n\n- XIII\n- Must Prayer necessarily be Attentive?\n- That even holy men sometimes suffer distraction of mind when at prayer is clear from the words: My heart hath forsaken me![209]\n- This question particularly concerns vocal prayer\n  - And for its solution we must know that a thing is said to be necessary in two senses: firstly, in the sense that by it a certain end is more readily attained, and in this sense attention is absolutely requisite in prayer [restatement]\n  - But a thing is said to be necessary also because without it a certain thing cannot attain its object at all [contrast]\n    - Now the effect or object of prayer is threefold [restatement]\n      - Its first effect—an effect, indeed, which is common to all acts springing from charity—is merit; but to secure this effect it is not necessarily required that attention should be kept up throughout the prayer, but the initial intention with which a man comes to prayer renders the whole prayer meritorious, as, indeed, is the case in all other meritorious acts. [restatement]\n- The second effect of prayer is peculiar to it, and that is to obtain favours; and for this, too, the primary intention suffices, and to it God principally looks\n  - But if the primary intention is wanting, prayer is not meritorious, neither can it win favours; for, as S. Gregory says, God hears not the prayer of a man who when he prays does not give heed to God.[210] [contrast]\n- The third effect of prayer is that which it immediately and actually brings about, namely, the spiritual refreshment of the soul; and to attain this end attention is necessarily required in prayer\n- Whence it is said, If I pray in a tongue my understanding btain what he asks, but will rather be mocking God.\" [consequence]\n- Of course, if a man purposely allowed his mind to wander in prayer, he would commit a sin and hinder the fruit of his prayer\n  - But that distraction of mind which is unintentional does not destroy the fruit of prayer. [contrast]\n- Against such S. Augustine says in his Rule[215]: \"When you pray to God in Psalms and hymns, entertain your heart with what your lips are reciting\n- Hence S. Basil also says: \"But if through the weakness of sinful nature you cannot pray with attention, restrain your imagination as far as you can, and God will pardon you, inasmuch as it is not from negligence but from weakness that you are unable to occupy yourself with Him as you should.\"\n- Cajetan: Does a man satisfy the precept of the Church if, being bound to the recitation of the Divine Office, he sets out with the intention of meditating upon the Divine Goodness or upon the Passion of Christ, and thus keeping his mind firmly fixed upon God\n  - Clearly a man who strives to keep his mind occupied during the whole of the Divine Office with contemplation of and devout affections towards God and Divine things fully satisfies his obligation [restatement]\n  - So, too, a man who aims at meditation on the Passion of Christ and devout affections on it during the whole Office, undoubtedly satisfies his obligation, for he is making use of a better means for keeping in touch with the Divinity than if he merely dwelt upon the meaning of the words [consequence]\n  - At the same time, he must be ready to lay this aside if in the course of the Office he finds himself uplifted to Divine things, for at this he must primarily aim [contrast]\n    - One who so prays, then, must make the Passion of Christ a means and not an end; he must, that is, be prepared to ascend thereby, if God grants it, to Divine things [restatement]\n      - In short, we may make use of any one of the species of attention enumerated above provided we do not exclude the higher forms [restatement]\n  - Thus, for example, if a man feels that it is more suited to his small capacity to aim simply at making no mistakes, and habitually makes use of this form of attention, he must still use it as a means only; he must, that is, be at God's disposition, for God may have mercy upon him and grant him, by reason of his dispositions, some better form of attention. [consequence]\n- Again, when a person prays for things needful for his support in life he must not be so occupied with the thought of these things as to appear to subordinate Divine things to human, as though prayer was but a means and his daily living the end\n  - We must bear in mind the doctrine laid down above[216]—viz., that all our prayers should tend to the attainment of grace and glory [restatement]\n    - We must occupy ourselves with the thought of eternal glory, or of the glory of the adoption of sons during this life, or with the virtues as means to arriving at our eternal home, and as the adornment of the inhabitants of heaven, and the commencement here of heavenly \"conversation\"; such things as these must be counted as the highest forms of attention (on 2 [restatement]\n- 2\n- 83\n- 13).\n- S. Augustine: Give joy to the soul of Thy servant, for to Thee, O Lord, I have lifted up my soul\n  - For Thou, O Lord, art sweet and mild.[217] [evidence]\n    - It seems to me that he calls God \"mild\" because He endures all our vagaries, and only awaits our prayers that He may perfect us [restatement]\n      - And when we offer Him our prayers He accepts them gratefully and hears them [restatement]\n  - Neither does He reflect on the careless way in which we pour them out, He even accepts prayers of which we are hardly conscious [restatement]\n  - For, Brethren, what man is there who would put up with it if a friend of his began a conversation with him, and yet, just when he was ready to reply to what his friend said, should discover that he was paying no attention to him but was saying something to someone else [evidence]\n    - Or supposing you were to appeal to a judge and were to appoint a place for him to hear your appeal, and then suddenly, while you were talking with him, were to put him aside and begin to gossip with a friend [restatement]\n  - And yet God puts up with the hearts of so many who pray to Him and who yet are thinking of other things, even evil things, even wicked things, things hateful to God; for even to think of unnecessary things is an insult to Him with Whom you have begun to talk [restatement]\n  - For your prayer is a conversation with God [evidence]\n  - When you read, God speaks to you; when you pray, you speak to God [qualification]\n    - And you may picture God saying to you: \"You forget how often you have stood before Me and have thought of such idle and superfluous things and have so rarely poured out to Me an attentive and definite prayer [restatement]\n  - But Thou, O Lord, art sweet and mild [contrast]\n    - Thou art sweet, bearing with me [restatement]\n      - It is from weakness that I slip away [restatement]\n  - But until Thou dost so, bear with me, for Thou, O Lord, art sweet and mild (Enarr. in Ps. lxxxv [contrast]\n- How long would he put up with you\n- Heal me and I shall stand; strengthen me and I shall be firm\n- 7).\n- S. Augustine: Praise the Lord, O my soul![218]\n  - Do we not praise the Lord [restatement]\n  - And what is it we praise [restatement]\n    - It is a great Thing that we praise, but that wherewith we praise is weak as yet [restatement]\n  - When does the singer fill up the praises of Him Whom he sings [qualification]\n    - A man stands and sings before God, often for a long space; but oftentimes, whilst his lips move to frame the words of his song, his thoughts fly away to I know not what desires [restatement]\n  - And so, too, our mind has sometimes been fixed on praising God in a definite manner, but our soul has flitted away, led hither and thither by divers desires and anxious cares [consequence]\n    - And then our mind, as though from up above, has looked down upon the soul as it flitted to and fro, and has seemed to turn to it and address its uneasy wanderings—saying to it: Praise the Lord, O my soul [restatement]\n  - And then our soul, as though weighed down and unable to stand firm as it should, replies to our mind: I will praise the Lord in my life [restatement]\n    - Why does it say in my life [restatement]\n  - Because now I am in my death! [evidence]\n- What mean these words, Brethren\n- Do we not sing hymns day by day\n- Do not our mouths, each according to their measure, sound forth day by day the praises of God\n- Why art thou anxious about other things than Him\n- Why busy thyself with the mortal things of earth\n- Why\n- Rouse yourself, then, and say: Praise the Lord, O my soul\n  - And your soul will reply to you: \"I praise Him as much as I can, though it is but weakly, in small measure, and with little strength [restatement]\n  - But why so [contrast]\n  - Because while we are in the body we are absent from the Lord.[219] [evidence]\n    - And why do you thus praise the Lord so imperfectly and with so little fixity of attention [restatement]\n      - Ask Holy Scripture: The corruptible body weigheth down the soul, and the earthly habitation presseth down the mind that museth upon many things.[220] [restatement]\n  - O take away, then, my body which weigheth down the soul, and then will I praise the Lord [restatement]\n  - Take away my earthly habitation which presseth down the mind that museth upon many things, so that, instead of many things I may be occupied with One Thing alone, and may praise the Lord [example]\n  - But as long as I am as I am, I cannot, for I am weighed down [contrast]\n  - Wilt thou never perfectly praise the Lord [restatement]\n    - I will praise the Lord in my life [restatement]\n- What then\n- Wilt thou be silent\n- (Enarr in Ps. cxlv\n- 1).\n- \"My spirit is in anguish within me; my heart within me is troubled\n  - Hear me speedily, O Lord: my spirit hath fainted away.\"[221] [restatement]\n- I remembered the days of old, I meditated on all Thy works; I meditated upon the works of Thy hands\n- I stretched forth my hands to Thee; my soul is as earth without water unto Thee\n- S. Thomas: The fruits of prayer are twofold\n  - For first there is the merit which thereby accrues to a man; and, secondly, there is the spiritual consolation and devotion which is begotten of prayer [evidence]\n    - And he who does not attend to, or does not understand his prayer, loses that fruit which is spiritual consolation; but we cannot say that he loses that fruit which is merit, for then we should have to say that very many prayers were without merit since a man can hardly say the Lord's Prayer without some distraction of mind [restatement]\n  - Hence we must rather say that when a person is praying and is sometimes distracted from what he is saying, or—more generally—when a person is occupied with some meritorious work and does not continuously and at every moment reflect that he is doing it for God, his work does not cease to be meritorious [consequence]\n    - And the reason is that in meritorious acts directed to a right end it is not requisite that our intention should be referred to that end at every moment, but the influence of the intention with which we begun persists throughout even though we now and again be distracted in some particular point; and the influence of this initial intention renders the whole body of what we do meritorious unless it be broken off by reason of some contrary affection intruding itself and diverting us from the end we had first in view to some other end contrary to it. [restatement]\n- And it must be remembered that there are three kinds of attention\n  - The first is attention to the words we are actually saying; and sometimes this is harmful, for it may hinder devotion [restatement]\n    - The second is attention to the meaning of the words, and this, too, may be harmful, though not gravely so [restatement]\n      - The third is attention to the goal of our prayer, and this better and almost necessary (Commentary on 1 Cor. xiv [restatement]\n- 14).\n", "stats": {"coverage": 100.0, "n_inserted": 0, "nodes": 105, "max_depth": 4, "unplaced": 21, "tags": {"restatement": 36, "contrast": 11, "consequence": 5, "evidence": 6, "qualification": 2, "example": 1}}}, {"slug": "35-xiv-should-our-prayers-be-long", "title": "XIV Should our Prayers be Long?", "group": "QUESTION LXXXIII — OF PRAYER", "words": 1032, "body": "XIV\n\nShould our Prayers be Long?\n\nIt would seem that we ought to pray continuously, for our Lord said: We ought always to pray and not to faint[222]; so also S. Paul: Pray without ceasing.[223]\n\nBut we must notice that when we speak of prayer we can mean either prayer considered in itself or the cause of prayer. Now the cause of prayer is the desire of the love of God; and all prayer ought to spring from this desire which is, indeed, continuous in us, whether actually or virtually, since this desire virtually remains in everything which we do from charity. But we ought to do all things for the glory of God: whether you eat or whether you drink, or whatsoever else you do, do all to the glory of God.[224] In this sense, then, prayer ought to be continual. Hence S. Augustine says to Proba: \"Therefore by our faith, by our hope, and by our charity, we are always praying, for our desire is continued.\"\n\nBut prayer considered in itself cannot be so continuous; for we must needs be occupied with other things. Hence S. Augustine says in the same place: \"At certain intervals, at divers hours and times, we pray to God in words so that by these outward signs of things we may admonish ourselves, and may learn what progress we have made in this same desire, and may stir ourselves up to increase it.\"\n\nBut the quantity of a thing has to be determined by its purpose, just as a draught has to be proportioned to the health of the man who takes it. Consequently it is fitting that prayer should only last so long as it avails to stir up in us this fervour of interior desire. And when it exceeds this measure, and its prolongation only results in weariness, it must not be prolonged further. Hence S. Augustine also says to Proba: \"The Brethren in Egypt are said to have had frequent prayers; but they were exceedingly brief, hardly more than eager ejaculations; and they adopted this method lest, if they prolonged their prayer, that vigilant attention which is requisite for prayer should lose its keen edge and become dulled. And thus they clearly show that this same attention, just as it is not to be forced if it fails to last, so neither is it to be quickly broken off if it does last.\"\n\nAnd just as we have to pay attention to this in our private prayers, and have to be guided by our powers of attention, so must we observe the same principles in public prayer where we have to be governed by the people's devotion.\n\nSome, however, argue that our prayers ought not to be continual, thus:\n\n1. Our Lord said[225]: And when you are praying speak not much. But it is not easy to see how a man can pray long without \"speaking much\"; more especially if it is a question of vocal prayer.\n\nBut S. Augustine says to Proba: \"To prolong our prayer does not involve 'much-speaking.' 'Much-speaking' is one thing; the unceasing desire of the heart is another. Indeed we are told of the Lord Himself that He passed the whole night in the prayer of God[226]; and, again, that being in an agony He prayed the longer,[227] and this that He might afford us an example.\" And Augustine adds a little later: \"Much speaking in prayer is to be avoided, but not much petition, if fervent attention lasts. For 'much-speaking' in prayer means the use of superfluous words when we pray for something necessary; but much petition means that with unceasing and devout stirrings of the heart we knock at His door to Whom we pray; and this is often a matter rather of groans than of words, of weeping than of speaking.\"\n\n2. Further, prayer is but the unfolding of our desires. But our desires are holy in proportion as they are confined to one thing, in accordance with those words of the Psalmist[228]: One thing I have asked of the Lord, this will I seek after. Whence it would seem to follow that our prayers are acceptable to God just in proportion to their brevity.\n\nBut to prolong our prayer does not mean that we ask for many things, but that our hearts are continuously set upon one object for which we yearn.\n\n3. Once more, it is unlawful for a man to transgress the limits which God Himself has fixed, especially in matters which touch the Divine worship, according to the words: Charge the people lest they should have a mind to pass the limits to see the Lord, and a very great multitude of them should perish.[229] But God Himself has assigned limits to our prayer by instituting the Lord's Prayer, as is evident from the words: Thus shalt thou pray.[230] Hence we ought not to extend our prayer beyond these limits.\n\nBut our Lord did not institute this prayer with a view to tying us down exclusively to these words when we pray, but to show us that the scope of our prayer should be limited to asking only for the things contained in it, whatever form of words we may use or whatever may be our thoughts.\n\n4. And lastly, with regard to the words of our Lord that we ought always to pray and not to faint,[231] and those of S. Paul, Pray without ceasing,[232] we must remark that a man prays without ceasing, either because of the unceasing nature of his desire, as we have above explained; or because he does not fail to pray at the appointed times; or because of the effect which his prayer has, whether upon himself—since even when he has finished praying he still remains devout—or upon others, as, for instance, when a man by some kind action induces another to pray for him whereas he himself desists from his prayer.\n\n\"Our soul waiteth for the Lord; for He is our helper and protector. For in Him our hearts shall rejoice; and in His Holy Name we have trusted. Let Thy mercy, O Lord, be upon us, as we have hoped in Thee.\"[233]", "outline": "# XIV Should our Prayers be Long?\n\n- XIV\n- Should our Prayers be Long?\n- It would seem that we ought to pray continuously, for our Lord said: We ought always to pray and not to faint[222]; so also S. Paul: Pray without ceasing.[223]\n- But we must notice that when we speak of prayer we can mean either prayer considered in itself or the cause of prayer\n  - Now the cause of prayer is the desire of the love of God; and all prayer ought to spring from this desire which is, indeed, continuous in us, whether actually or virtually, since this desire virtually remains in everything which we do from charity [restatement]\n  - But we ought to do all things for the glory of God: whether you eat or whether you drink, or whatsoever else you do, do all to the glory of God.[224] [contrast]\n    - In this sense, then, prayer ought to be continual [restatement]\n  - Hence S. Augustine says to Proba: \"Therefore by our faith, by our hope, and by our charity, we are always praying, for our desire is continued.\" [consequence]\n- But prayer considered in itself cannot be so continuous; for we must needs be occupied with other things\n  - Hence S. Augustine says in the same place: \"At certain intervals, at divers hours and times, we pray to God in words so that by these outward signs of things we may admonish ourselves, and may learn what progress we have made in this same desire, and may stir ourselves up to increase it.\" [consequence]\n- But the quantity of a thing has to be determined by its purpose, just as a draught has to be proportioned to the health of the man who takes it\n  - Consequently it is fitting that prayer should only last so long as it avails to stir up in us this a man by some kind action induces another to pray for him whereas he himself desists from his prayer.\n- \"Our soul waiteth for the Lord; for He is our helper and protector\n  - For in Him our hearts shall rejoice; and in His Holy Name we have trusted [evidence]\n    - Let Thy mercy, O Lord, be upon us, as we have hoped in Thee.\"[233] [restatement]\n", "stats": {"coverage": 100.0, "n_inserted": 0, "nodes": 35, "max_depth": 3, "unplaced": 0, "tags": {"restatement": 8, "contrast": 4, "consequence": 5, "evidence": 2}}}, {"slug": "36-xv-is-prayer-meritorious", "title": "XV Is Prayer Meritorious?", "group": "QUESTION LXXXIII — OF PRAYER", "words": 1359, "body": "XV\n\nIs Prayer Meritorious?\n\nOn the words of the Psalmist, My prayer shall be turned into my bosom,[234] the interlinear Gloss has: \"And if it is of no profit to them (for whom it is offered), at least I myself shall not lose my reward.\" A reward, however, can only be due to merit. Prayer, then, is meritorious.\n\nAs we have said above, prayer has, besides the effect of spiritual consolation which it brings with it, a twofold power regarding the future: the power, namely, of meriting, and that of winning favours. But prayer, as indeed every other virtuous act, derives its power of meriting from that root which is charity, and the true and proper object of charity is that Eternal Good, the enjoyment of Which we merit. Now prayer proceeds from charity by means of the virtue of religion whose proper act is prayer; there accompany it, however, certain other virtues which are requisite for a good prayer—namely, faith and humility. For it belongs to the virtue of religion to offer our prayers to God; while to charity belongs the desire of that the attainment of which we seek in prayer. And faith is necessary as regards God to Whom we pray; for we must, of course, believe that from Him we can obtain what we ask. Humility, too, is called for on the part of the petitioner, for he must acknowledge his own needs. And devotion also is necessary; though this comes under religion of which it is the first act, it conditions all subsequent effects.\n\nAnd its power of obtaining favours prayer owes to the grace of God to Whom we pray, and Who, indeed, induces us to pray. Hence S. Augustine says[235]: \"He would not urge us to ask unless He were ready to give\"; and S. Chrysostom says: \"He never refuses His mercies to them who pray, since it is He Who in His loving-kindness stirs them up so that they weary not in prayer.\"\n\nBut some say that prayer cannot be meritorious, thus:\n\n1. Merit proceeds from grace, but prayer precedes grace, since it is precisely by prayer that we win grace: Your Father from Heaven will give the Good Spirit to them that ask Him.[236]\n\nBut prayer, like any other virtuous act, cannot be meritorious without that grace which makes us pleasing to God. Yet even that prayer which wins for us the grace which renders us pleasing to God must proceed from some grace—that is, from some gratuitous gift; for, as S. Augustine says, to pray at all is a gift of God.[237]\n\n2. Again, prayer cannot be meritorious, for if it were so it would seem natural that prayer should especially merit that for which we actually pray. Yet this is not always the case, for even the prayers of the Saints are often not heard; S. Paul, for example, was not heard when he prayed that the sting of the flesh might be taken away from him.[238]\n\nBut we must notice that the merit of our prayers sometimes lies in something quite different from what we beg for. For whereas merit is to be especially referred to the possession of God, our petitions in our prayers at times refer directly to other things, as we have pointed out above. Consequently, if what a man asks for will not tend to his ultimate attainment of God, he does not merit it by his prayer; sometimes, indeed, by asking and desiring such a thing he may lose all merit, as, for example, if a man were to ask of God something which was sinful and which he could not reverently ask for. Sometimes, however, what he asks for is not necessary for his salvation, nor yet is it clearly opposed to his salvation; and when a man so prays he may by his prayer merit eternal life, but he does not merit to obtain what he actually asks for. Hence S. Augustine says[239]: \"He who asks of God in faith things needful for this life is sometimes mercifully heard and sometimes mercifully not heard. For the physician knows better than the patient what will avail for the sick man.\" It was for this reason that Paul was not heard when he asked that the sting of the flesh might be taken away—it was not expedient. But if what a man asks for will help him to the attainment of God, as being something conducive to his salvation, he will merit it, and that not only by praying for it but also by doing other good works; hence, too, he undoubtedly will obtain what he asks for, but when it is fitting that he should obtain it: \"for some things are not refused to us but are deferred, to be given at a fitting time,\" as S. Augustine says.[240] Yet even here hindrance may arise if a man does not persevere in asking; hence S. Basil says[241]: \"When then you ask and do not receive, this is either because you asked for what you ought not, or because you asked without lively faith, or carelessly, or for what would not profit you, or because you ceased to ask.\" And since a man cannot, absolutely speaking, merit eternal life for another, nor, in consequence, those things which belong to eternal life, it follows that a man is not always heard when he prays for another. For a man, then, always to obtain what he asks, four conditions must concur: he must ask for himself, for things necessary for salvation; he must ask piously and perseveringly.\n\n3. Lastly, prayer essentially reposes upon faith, as S. James says: But let him ask in faith, nothing wavering.[242] But faith is not sufficient for merit, as is evident in the case of those who have faith without charity. Therefore prayer is not meritorious.\n\nBut while it is true that prayer rests principally upon faith, this is not for its power of meriting—for as regards this it rests principally on charity—but for its power of winning favours; for through faith man knows of the Divine Omnipotence and Mercy whence prayer obtains what it asks.\n\nS. Augustine: Men, then, love different things, and when each one seemeth to have what he loves, he is called happy. But a man is truly happy, not if he has what he loves, but if he loves what ought to be loved. For many become more wretched through having what they love than they were when they lacked it. Miserable enough through loving harmful things, more miserable through having them. And our Merciful God, when we love amiss, denies us what we love; but sometimes in His anger He grants a man what he loves amiss!... But when we love what God wishes us to love, then, doubtless, He will give it us. This is That One Thing Which ought to be loved: that we may dwell in the House of the Lord all the days of our life! (Enarr. in Ps. xxvi.).\n\nS. Augustine: In those tribulations, then, which can both profit us and harm us, we know not what we should pray for as we ought. Yet none the less since they are hard, since they are vexatious, since, too, they are opposed to our sense of our own weakness, mankind with one consent prays that they may be removed from us. But we owe this much devotion to the Lord our God that, if He refuses to remove them, we should not therefore fancy that we are neglected by Him, but, while bearing these woes with devout patience, we should hope for some greater good, for thus is power perfected in infirmity. Yet to some in their impatience the Lord God grants in anger what they ask, just as in His mercy He refused it to the Apostle (Ep. cxxx. ad Probam).\n\n\"Hear my prayer, O Lord, and my supplication; give ear to my tears. Be not silent: for I am a stranger with Thee, and a sojourner as all my fathers were. O forgive me, that I may be refreshed; before I go hence, and be no more.\"[243]", "outline": "# XV Is Prayer Meritorious?\n\n- XV\n- Is Prayer Meritorious?\n- On the words of the Psalmist, My prayer shall be turned into my bosom,[234] the interlinear Gloss has: \"And if it is of no profit to them (for whom it is offered), at least I myself shall not lose my reward\n  - A reward, however, can only be due to merit [restatement]\n    - Prayer, then, is meritorious. [restatement]\n- As we have said above, prayer has, besides the effect of spiritual consolation which it brings with it, a twofold power regarding the future: the power, namely, of meriting, and that of winning favours\n  - But prayer, as indeed every other virtuous act, derives its power of meriting from that root which is charity, and the true and proper object of charity is that Eternal Good, the enjoyment of Which we merit [contrast]\n    - Now prayer proceeds from charity by means of the virtue of religion whose proper act is prayer; there accompany it, however, certain other virtues which are requisite for a good prayer—namely, faith and humility [restatement]\n  - For it belongs to the virtue of religion to offer our prayers to God; while to charity belongs the desire of that the attainment of which we seek in prayer [evidence]\n    - And faith is necessary as regards God to Whom we pray; for we must, of course, believe that from Him we can obtain what we ask [restatement]\n      - Humility, too, is called for on the part of the petitioner, for he must acknowledge his own needs [restatement]\n  - And devotion also is necessary; though this comes under religion of which it is the first act, it conditions all subsequent effects. [restatement]\n- And its power of obtaining favours prayer owes to the grace of God to Whom we pray, and Who, indeed, induces us to pray\n  - Hence S. Augustine says[235]: \"He would not urge us to ask unless He were ready to give\"; and S. Chrysostom says: \"He ne a sojourner as all my fathers were\n- O forgive me, that I may be refreshed; before I go hence, and be no more.\"[243]\n", "stats": {"coverage": 100.0, "n_inserted": 0, "nodes": 50, "max_depth": 4, "unplaced": 3, "tags": {"restatement": 12, "contrast": 11, "evidence": 5, "consequence": 4}}}, {"slug": "37-xvi-do-sinners-gain-anything-from-god-by", "title": "XVI Do Sinners gain Anything From God by their Prayers?", "group": "QUESTION LXXXIII — OF PRAYER", "words": 752, "body": "XVI\n\nDo Sinners gain Anything From God by their Prayers?\n\nS. Augustine says[244]: \"If God did not hear sinners, in vain would the publican have said, God be merciful to me a sinner\"; and S. Chrysostom says[245]: \"Every one that asketh receiveth—that is, whether he be just man or sinner.\" Hence the prayers of sinners do win something from God.\n\nIn a sinner we have to consider two things: his nature, which God loves; his fault, which God hates. If, then, a sinner asks something of God formally as a sinner—that is, according to his sinful desires—God, out of His mercy, does not hear him, though sometimes He does hear him in His vengeance, as when He permits a sinner to fall still farther into sin. For God \"in mercy refuses some things which in anger He concedes,\" as S. Augustine says.[246] But that prayer of a sinner which proceeds from the good desire of his nature God hears, not, indeed, as bound in justice to do so, for that the sinner cannot merit, but out of His pure mercy, and on condition, too, that the four above-mentioned conditions are observed—namely, that he prays for himself, for things needful for his salvation, that he prays devoutly and perseveringly.\n\nSome, however, maintain that sinners do not by their prayers win anything from God, thus:\n\n1. It is said in the Gospel,[247] Now we know that God doth not hear sinners; and this accords with those words of Proverbs[248]; He that turneth away his ears from hearing the law, his prayer shall be an abomination. But a prayer which is \"an abomination\" cannot win anything from God.\n\nBut, as S. Augustine remarks,[249] the words first quoted are due to the blind man as yet unanointed—viz., not yet perfectly illumined—and hence they are not valid; though they might be true if understood of a sinner precisely as such, and in this sense, too, his prayer is said to be \"an abomination.\"\n\n2. Again, just men obtain from God what they merit, as we have said above. Sinners, however, can merit nothing, since they are without grace, and even without charity which, according to the Gloss[250] on the words, Having an appearance of piety, but denying the power thereof, is \"the power of piety.\" And hence they cannot pray piously, which, as we have said above, is requisite if prayer is to gain what it asks for.\n\nBut though a sinner cannot pray piously in the sense that his prayer springs from the habit of virtue, yet his prayer can be pious in the sense that he asks for something conducive to piety, just as a man who has not got the habit of justice can yet wish for some just thing, as we have pointed out above. And though such a man's prayer is not meritorious, it may yet have the power of winning favours; for while merit reposes upon justice, the power of winning favours reposes upon grace.\n\n3. Lastly, S. Chrysostom says[251]: \"The Father does not readily hear prayers not dictated by the Son.\" But in the prayer which Christ dictated it is said: Forgive us our debts as we also forgive our debtors, which sinners do not. Hence sinners either lie when they say this prayer, and so do not deserve to be heard, or, if they do not say it, then they are not heard because they do not make use of the form of prayer instituted by Christ.\n\nBut, as we have explained above, the Lord's Prayer is spoken in the name of the whole Church. Consequently, if a man—while unwilling to forgive his neighbour his debts—yet says this prayer, he does not lie; for while what he says is not true as regards himself, it yet remains true as regards the Person of the Church outside of which he deservedly is, and he loses, in consequence, the fruit of his prayer. Sometimes, however, sinners are ready to forgive their debtors, and consequently their prayers are heard, in accordance with those words of Ecclesiasticus[252]: Forgive thy neighbour if he hath hurt thee, and then shall thy sins be forgiven to thee when thou prayest.\n\n\"With the Lord shall the steps of a man be directed, and he shall like well his way. When he shall fall, he shall not be bruised, for the Lord putteth His hand under him. I have been young, and now am old; and I have not seen the just forsaken, nor his seed seeking bread.\"[253]", "outline": "# XVI Do Sinners gain Anything From God by their Prayers?\n\n- XVI\n- Do Sinners gain Anything From God by their Prayers?\n- S. Augustine says[244]: \"If God did not hear sinners, in vain would the publican have said, God be merciful to me a sinner\"; and S. Chrysostom says[245]: \"Every one that asketh receiveth—that is, whether he be just man or sinner\n  - Hence the prayers of sinners do win something from God. [consequence]\n- In a sinner we have to consider two things: his nature, which God loves; his fault, which God hates\n  - If, then, a sinner asks something of God formally as a sinner—that is, according to his sinful desires—God, out of His mercy, does not hear him, though sometimes He does hear him in His vengeance, as when He permits a sinner to fall still farther into sin [qualification]\n  - For God \"in mercy refuses some things which in anger He concedes,\" as S. Augustine says.[246] [evidence]\n  - But that prayer of a sinner which proceeds from the good desire of his nature God hears, not, indeed, as bound in justice to do so, for that the sinner cannot merit, but out of His pure mercy, and on condition, too, that the four above-mentioned conditions are observed—namely, that he prays for himself, for things needful for his salvation, that he prays de ome nigh to God; and this is signified by the name prayer, for prayer is \"the uplifting of the mind towards God.\" Secondly, petition is required, and is signified by the word postulation; now a petition may be set forth in definite terms—and this some term postulation, properly so called; or it may be set forth in no express terms, as when a man asks for God's help, and this some call supplication; or, again, the fact in question may be simply narrated, as in S. John[255]: He whom Thou lovest is sick, and this some call insinuation. And thirdly, there is required a reason for asking for what we pray for, and this reason may be either on the part of God or on the part of the petitioner. The reason for asking on the part of God is His holiness, by reason of which we ask to be heard: Incline Thine ear and hear ... for Thine own sake, O my God;[256] to this belongs obsecration—namely, an appeal to sacred things, as when we say: By Thy Nativity, deliver us, O Lord! But the reason for asking on the part of the petitioner is thankfulness, for by giving thanks for benefits already received we merit to receive still greater ones, as is set forth in the Church's Collect.[257] Hence the Gloss[258] says that in the Mass \"Obsecrations are the prayers which precede the Consecration,\" for in them we commemorate certain sacred things; \"in the Consecration itself we have prayers,\" for then the mind is especially uplifted towards God; \"but in the subsequent petitions we have postulations, and at the close thanksgivings.\" These four parts of prayer may be noticed in many of the Church's Collects: thus in the Collect for Trinity Sunday, the words Almighty and Everlasting God signify the uplifting of the soul in prayer to God; the words: Who hast granted to Thy servants to acknowledge in their profession of the true faith the glory of the Eternal Trinity, and in the Power of Its Majesty to adore Its Unity, signify giving of thanks; the words: Grant, we beseech Thee, that by perseverance in this same faith we may be ever defended from all adversities, signify postulation; while the closing words: Through our Lord Jesus Christ, etc., signify obsecration.\n\nIn the Conferences of the Fathers, however,[259] we read: \"Obsecration is imploring pardon for sin; prayer is when we make vows to God; postulation is when we make petition for others; giving of thanks, those ineffable outpourings by which the mind renders thanks to God.\" But the former explanation is preferable.\n\nSome, however, object to these divisions of prayer, thus:\n\n1. Obsecration is apparently to swear by someone, whereas Origen remarks[260]: \"A man who desires to live in accordance with the Gospel must not swear by anyone, for if it is not allowed to swear, neither is it allowed to swear by anyone.\"\n\nBut it is sufficient to remark that obsecration is not a swearing by, or adjuring of God, as though to compel Him, for this is forbidden, but to implore His mercy.\n\n2. Again, S. John Damascene says[261] that prayer is \"the asking God for things that are fitting.\" Hence it is not exact to distinguish prayers from postulations.\n\nBut prayer, generally considered, embraces all the above-mentioned parts; when, however, we distinguish one part against another, prayer, properly speaking, means the uplifting of the mind to God.\n\n3. Lastly, giving of thanks refers to the past, whereas the other parts of prayer refer to the future. Hence giving of thanks should not be placed after the rest.\n\nBut whereas in things which are different from one another the past precedes the future, in one and the same thing the future precedes the past. Hence giving of thanks for benefits already received precedes petition; yet those same benefits were first asked for, and then, when they had been received, thanks were offered for them. Prayer, however, precedes petition, for by it we draw nigh to God to Whom we make petition. And obsecration precedes prayer, for it is from dwelling upon the Divine Goodness that we venture to approach to Him.\n\nCajetan: We might be asked how the mind can be especially elevated to God at the moment of consecration. For in the consecration the priest has to express distinctly the words of consecration, and consequently cannot have his mind uplifted towards God at that moment. Indeed, the more his mind is uplifted to God, the less he thinks of inferior things, words, and so forth.\n\nBut in the consecration of the Holy Eucharist—in which the priest in a sense brings God down upon earth—the very greatness of our uplifting of mind towards the Divine Goodness Which has thus deigned to come amongst us is the very reason for our attention to the words in the act of consecration, and makes the priest pronounce them distinctly and reverently. Some scrupulous folk, however, concentrate their whole attention on being intent and attentive; but this is really a distraction, and not attention, for its object is precisely the being attentive. The uplifting, then, of our minds to God in the consecration has indeed to be the very greatest, not, indeed, intensively and by abstraction from the things of sense, but objectively and concentrated—though always within the limits compatible with attention—on the endeavour to say the words as they should be said (on 2. 2. 83. 17.)\n\nS. Augustine: And David went in and sat before the Lord[262]; and Elias, casting himself down upon the earth, put his face between his knees.[263] By examples such as these we are taught that there is no prescribed position of the body in prayer provided the soul states its intention in the presence of God. For we pray standing, as it is written: The Publican standing afar off. We pray, too, on our knees, as we read in the Acts of the Apostles;[264] and we pray sitting, as in the case of David and Elias. And unless it were lawful to pray lying down, it would not be said in the Psalms[265]: Every night I will wash my bed, I will water my couch with my tears. When, then, a man desires to pray, he settles himself in any position that serves at the time for the stirring up of his soul. When, on the other hand, we have no definite intention of praying, but the wish to pray suddenly occurs to us—when, that is, there comes of a sudden into our mind something which rouses the desire to pray \"with unspeakable groanings\"—then, in whatsoever position such a feeling may find us, we are not to put off our prayer; we are not to look about for some place whither we can withdraw, for some place in which to stand or in which to make prostration. For the very intention of the mind begets a solitude, and we often forget to which quarter of the heavens we were looking, or in what bodily position the occasion found us (Of Divers Questions, iv.).\n\n\"Hear, O God, my prayer, and despise not my supplication; be attentive to me and hear me. I am grieved in my exercise; and am troubled at the voice of the enemy, and at the tribulation of the sinner. For they have cast iniquities upon me, and in wrath they were troublesome to me. My heart is troubled within me, and the fear of death is fallen upon me. Fear and trembling are come upon me, and darkness hath covered me. And I said: Who will give me wings like a dove, and I will fly and be at rest?\"[266]", "outline": "# XVII Can We rightly term Supplications,\" \"Prayers,\" \"Intercessions,\" and \"Thanksgivings,\" parts of Prayer?\n\n- XVII\n- Can We rightly term Supplications,\" \"Prayers,\" \"Intercessions,\" and \"Thanksgivings,\" parts of Prayer?\n- The Apostle says to Timothy[254]: I desire therefore first of all that supplications, prayers, intercessions, and thanksgivings be made by all men.\n- For prayer three things are required: first of all, that he who prays come nigh to God; and this is signified by the name prayer, for prayer is \"the uplifting of the mind towards God\n  - Secondly, petition is required, and is signified by the word postulation; now a petition may be set forth in definite terms—and this some term postulation, properly so called; or it may be set forth in no express terms, as when a man asks for God's help, and this some call supplication; or, again, the fact in question may be simply narrated, as in S. John[255]: He whom Thou lovest is sick, and this some call insinuation [restatement]\n    - And thirdly, there is required a reason for asking for what we pray for, and this reason may be either on the part of God or on the part of the petitioner [restatement]\n  - The reason for asking on the part of God is His holiness, by reason of which we ask to be heard: Incline Thine ear and hear ... for Thine own sake, O my God;[256] to this belongs obsecration—namely, an appeal to sacred things, as when we say: By Thy Nativity, deliver us, O Lord [evidence]\n  - But the reason for asking on the part of the petitioner is thankfulness, for by giving thanks for benefits already received we merit to receive still greater ones, as is set forth in the Church's Collect.[257] [contrast]\n  - Hence the Gloss[258] says that in the Mass \"Obsecrations are the prayers which precede the Consecration,\" for in them we commemorate certain sacred things; \"in the Consecration itself we have prayers,\" for then the mind is especially uplifted towards God; \"but in the subsequent petitions we have postulations, and at the close thanksgivings [consequence]\n    - These four parts of prayer may be noticed in many of the Church's Collects: thus in the Collect for Trinity Sunday, the words Almighty and Everlasting God signify the uplifting of the soul in prayer to God; the words: Who hast granted to Thy servants to acknowledge in their profession of the true faith the glory of the Eternal Trinity, and in the Power of Its Majesty to adore Its Unity, signify giving of thanks; the words: Grant, we beseech Thee, that by perseverance in this same faith we may be ever defended from all adversities, signify postulation; while the closing words: Through our Lord Jesus Christ, etc., signify obsecration. [restatement]\n- In the Conferences of the Fathers, however,[259] we read: \"Obsecration is imploring pardon for sin; prayer is when we make vows to God; postulation is when we make petition for others; giving of thanks, those ineffable outpourings by which the mind renders thanks to God\n  - But the former explanation is preferable. [contrast]\n- Some, however, object to these divisions of prayer, thus:\n- 1. Obsecration is apparently to swear by someone, whereas Origen remarks[260]: \"A man who desires to live in accordance with the Gospel must not swear by anyone, for if it is not allowed to swear, neither is it allowed to swear by anyone.\"\n- But it is sufficient to remark that obsecration is not a swearing by, or adjuring of God, as though to compel Him, for this is forbidden, but to implore His mercy.\n- 2. Again, S. John Damascene says[261] that prayer is \"the asking God for things that are fitting\n  - Hence it is not exact to distinguish prayers from postulations. [consequence]\n- But prayer, generally considered, embraces all the above-mentioned parts; when, however, we distinguish one part against another, prayer, properly speaking, means the uplifting of the mind to God.\n- 3. Lastly, giving of thanks refers to the past, whereas the other parts of prayer refer to the future\n  - Hence giving of thanks should not be placed after the rest. [consequence]\n- But whereas in things which are different from one another the past precedes the future, in one and the same thing the future precedes the past\n  - Hence giving of thanks for benefits already received precedes petition; yet those same benefits were first asked for, and then, when they had been received, thanks were offered for them [consequence]\n    - Prayer, however, precedes petition, for by it we draw nigh to God to Whom we make petition [restatement]\n      - And obsecration precedes prayer, for it is from dwelling upon the Divine Goodness that we venture to approach  come to honour or dishonour, he shall not understand, S. Gregory says: \"This is not to be understood of the souls of the Saints, for they see from within the glory of Almighty God, it is in nowise credible that there should be anything without of which they are ignorant.\"[268]\n\nAnd he says also: \"To the soul that sees its Creator all created things are but trifling; for, however little of the Creator's light he sees, all that is created becomes of small import to him.\"[269] Yet the greatest difficulty in saying that the souls of the Saints know our prayers and other things which concern us, is their distance from us. But since, according to the authority just quoted, this distance does not preclude such knowledge, it appears that the souls of the Saints do know our prayers and other things which concern us.\n\nFurther, if they did not know what concerned us, neither would they pray for us, since they would not know our deficiencies. But this was the error of Vigilantius, as S. Jerome says in his Epistle against him.[270] The Saints, then, know what concerns us.\n\nThe Divine Essence, then, is a sufficient medium for knowing all things, as, indeed, is evident from the fact that God in seeing His own essence sees all things. Yet it does not follow that whoever sees the Essence of God therefore sees all things, but those only who comprehend the Essence of God; just in the same way as it does not follow that because we know a principle we therefore know all that that principle contains, for that would only be the case if we comprehended the whole power of the principle. Since, then, the souls of the Saints do not comprehend the Divine Essence, it does not follow that they know everything which could be known through the medium of that Divine Essence. Hence the inferior Angels are taught certain things by the higher Angels, though all see the Divine Essence. But each person in possession of the Beatific Vision only sees in the Divine Essence as much of other things as is necessitated by the degree of perfection of his beatitude; and for the perfection of beatitude it is required that a man \"should have whatever he wants, and should desire nothing in an inordinate fashion.\"[271] Each one, however, rightly desires to know those things which concern himself. Hence, since no rectitude is lacking to the Saints, they wish to know those things which concern themselves, and consequently they must know them in the Word. But it belongs to their glory that they should be able to help on the salvation of those who need it, for it is thus that they are made co-workers with God—\"than which there is nought more Divine,\" as Denis says.[272] It is clear, then, that the Saints have a knowledge of those things which are requisite for this end. And so, too, it is manifest that they know in the Word the desires, the devout acts and the prayers, of men who fly to them for help.\n\nSome, however, maintain that the Saints do not know our prayers, thus:\n\n1. On the words of Isaias,[273] Thou art our Father, and Abraham hath not known us, and Israel hath been ignorant of us, the Interlinear Gloss has: \"For the Saints who are dead know not what the living do, even their own children.\" This is taken from S. Augustine's treatise On Care for the Dead, xiii., where he quotes these words, and adds: \"If these great Patriarchs were ignorant of what concerned those whom they had begotten, how can the dead be concerned with knowing and assisting the affairs and the deeds of the living?\" Hence it would seem that the Saints are not cognizant of our prayers.\n\nBut these words of S. Augustine are to be understood of the natural knowledge of the souls separated (from this world); and this knowledge is not obscured in holy men as it is in sinners. Moreover, S. Augustine is not talking of that knowledge which is in the Word, a knowledge which it is clear that Abraham had not at the time that Isaias said these things; for anterior to Christ's Passion no one had attained to the Vision of God.\n\n2. In 4 Kings xxii. 20, it is said to Josias the king: Therefore—because, that is, thou didst weep before Me—I will gather thee to thy fathers ... that thy eyes may not see all the evils which I will bring upon this place. But the death of Josias would have been no relief to him if he was to know after death what was going to happen to his nation. The Saints, then, who are dead, do not know our acts, and consequently cannot understand our prayers.\n\nBut although after this life the Saints know the things which are done here below, we are not therefore to suppose that they are filled with grief at the knowledge of the afflictions of those whom they loved in the world. For they are so filled with the joy of their beatitude that sorrow finds no place in them. Hence, if they know after death the evil plight of those dear to them, it is none the less a relief to their sorrow if they are withdrawn from this world before those woes come on.\n\nAt the same time it is possible that souls not yet in glory would feel a certain grief if they were made aware of the sorrows of those dear to them. And since the soul of Josias was not immediately glorified on its quitting the body, S. Augustine endeavours to argue that the souls of the dead have no knowledge of the deeds of the living.[274]\n\n3. Again, the more a person is perfected in charity the more ready he is to succour his neighbour in peril. But the Saints while still in the flesh had a care for their neighbours, and especially for their relatives, when in peril. Since, then, they are after death far more perfected in charity, if they were cognizant of our deeds, they would have now a much greater care for those dear to them or related to them, and would help them much more in their necessities; but this does not seem to be the case. Whence it would seem that they are not cognizant of our actions nor of our prayers.\n\nBut the souls of the Saints have their will perfectly conformed to the Will of God, even in what they would will. Consequently, while retaining their feelings of charity towards their neighbour, they afford them no other assistance than that which they see is arranged for them in accordance with Divine Justice. Yet at the same time we must believe that they help their neighbours very much indeed by interceding for them with God.\n\n4. Further, just as the Saints after death see the Word, so also do the Angels, for of them it is said: Their Angels in Heaven always see the face of My Father Who is in Heaven.[275] But the Angels, though seeing the Word, do not therefore know all things, for the inferior Angels are purified of their ignorance by the superior Angels, as is evident from Denis.[276] Consequently, neither do the Saints, although they see the Word, know in It our prayers and other things which concern us.\n\nBut although it is not necessary that those who see the Word should see all things in the Word, they none the less see those things which belong to the perfection of their beatitude, as we have said above.\n\n5. Lastly, God alone is the Searcher of hearts. But prayer is essentially an affair of the heart. Consequently God alone knows our prayers.\n\nBut God alone knows of Himself the thoughts of the heart; others know them according as they are revealed to them either in their vision of the Word or in any other way.", "outline": "# I Are the Saints cognizant of our Prayers?\n\n- I\n- Are the Saints cognizant of our Prayers?\n- On those words of Job,[267] Whether his children come to honour or dishonour, he shall not understand, S. Gregory says: \"This is not to be understood of the souls of the Saints, for they see from within the glory of Almighty God, it is in nowise credible that there should be anything without of which they are ignorant.\"[268]\n- And he says also: \"To the soul that sees its Creator all created things are but trifling; for, however little of the Creator's light he sees, all that is created becomes
