inciple is virtually discoverable in the movements of the things it sets in motion.\n- 3. Lastly, all special kinds of acts belong either to the appetitive or to the cognoscitive faculties\n  - But devotion comes under neither of these—as will be evident to anyone who will reflect upon the various acts of these faculties respectively. [contrast]\n- But devotion is an act of the appetitive powers of the soul, and is, as we have said above, a movement of the will.\n- Cajetan: With regard to the proper meaning of the term devotion, note that since devotion is clearly derived from devoting, and since to devote—derived in its turn from to vow—means to promise something spontaneously to God: it follows that the principle in all such promises is the will; and further, not the will simply as such, but the will so affected as to be prompt\n  - Hence in Latin those are said to be devoted to some superior whose will is so affected towards him as to make them prompt in his regard [consequence]\n    - And this seems to refer especially to God and to those who in a sense stand in His place, as, for instance, our rulers, our fatherland, and our principles of action [restatement]\n  - Hence in the Church's usage the term devotion is especially applied to those who are so affected towards God as to be prompt in His regard and in all that concerns Him [consequence]\n  - And so devotion is here taken to signify the act of a will so disposed, the act by which a man shows himself prompt in the Divine service [consequence]\n  - Thus, then, devotion, the principal act of the virtue of religion, implies first of all the prompt desire of the Divine honour in our exercise of Divine worship; and hence comes the prompt choice of appropriate means to this end, and also the prompt carrying out of what we see to be suitable to that end [consequence]\n    - And the proof of possession of such devotion is that truly devout souls, the moment they perceive that some particular thing (or other) ought to be done for the service of God, are so promptly moved towards it that they rejoice in having to do or in actually doing it (on 2 [restatement]\n- 2\n- 82\n- 1).\n- S. Augustine: Give me, O Lord, Thyself; grant Thyself to me\n  - For Thee do I love, and if my love be but weak, then would I love Thee more [evidence]\n  - For I cannot measure it so as to know how much my love falls short of that love which shall make my life run to Thy embraces nor ever turn away from Thee till I be hid in the hiding-place of Thy countenance [evidence]\n    - This only do I know: that it fares ill with me when away from Thee; and this not merely externally, but within me; for all abundance which is not my God is but penury for me [restatement]\n- (Confessions, XIII. viii\n- 2).\n", "stats": {"coverage": 100.0, "n_inserted": 0, "nodes": 39, "max_depth": 3, "unplaced": 5, "tags": {"contrast": 4, "consequence": 10, "restatement": 5, "evidence": 2}}}, {"slug": "16-ii-is-devotion-an-act-of-the-virtue-of-r", "title": "II Is Devotion an Act of the Virtue of Religion?", "group": "QUESTION LXXXII — OF DEVOTION", "words": 548, "body": "II\n\nIs Devotion an Act of the Virtue of Religion?\n\nDevotion is derived from \"devoting oneself\" or making vows. But a vow is an act of the virtue of religion. Consequently devotion also is an act of the virtue of religion.\n\nIt belongs to the same virtue to wish to do a thing and to have a prompt will to do it, for the object of each of these acts is the same. For this reason the Philosopher says[82]: \"Justice is that by which men will and perform just deeds.\" And it is clear that to perform those things which pertain to the Divine worship or service comes under the virtue of religion. Consequently it belongs to the same virtue of religion to have a prompt will to carry out these things—in other words, to be devout. Whence it follows that devotion is an act of the virtue of religion.\n\nBut some argue that devotion is not an act of the virtue of religion, thus:\n\n1. Devotion means that a man gives himself to God. But this belongs to the virtue of charity, for, as S. Denis says[83]: \"Divine love causes ecstasy since it permits not that those who love should belong any more to themselves, but to those things which they love.\" Whence devotion would seem to be rather an act of charity than of the virtue of religion.\n\nIt is indeed through charity that a man gives himself to God, clinging to Him by a certain union of soul; but that a man should give himself to God and occupy himself with the Divine service, is due directly to the virtue of religion, though indirectly it is due to the virtue of charity, which is the principle of the virtue of religion.\n\n2. Again, charity precedes the virtue of religion. But devotion seems to precede charity; for charity is signified in Scripture by fire, and devotion by the fat of the sacrifices—the material on which the fire feeds. Consequently devotion is not an act of the virtue of religion.\n\nBut while the fat of the body is generated by the natural digestive heat, that natural heat finds its nourishment in that same fat. Similarly charity both causes devotion—since it is by love that a man becomes prompt to serve his friend—and at the same time charity is fed by devotion; just as all friendship is preserved and increased by the practice of friendly acts and by meditating upon them.\n\n3. Lastly, by the virtue of religion a man turns to God alone. But devotion extends to men as well; people, for instance, are said to be devoted to certain Saints, and servants are said to be devoted to their masters, as S. Leo says of the Jews,[84] that being devoted to the Roman laws, they said: We have no king but Cæsar.[85] Consequently devotion is not an act of the virtue of religion.\n\nBut the devotion which we have to the Saints of God, whether living or dead, does not stop at them, but passes on to God, since we venerate God in God's ministers. And the devotion which subjects have to their temporal masters is of a different kind altogether, just as the service of temporal masters differs from the service of the Divine Master.", "outline": "# II Is Devotion an Act of the Virtue of Religion?\n\n- II\n- Is Devotion an Act of the Virtue of Religion?\n- Devotion is derived from \"devoting oneself\" or making vows\n  - But a vow is an act of the virtue of religion [contrast]\n  - Consequently devotion also is an act of the virtue of religion. [consequence]\n- It belongs to the same virtue to wish to do a thing and to have a prompt will to do it, for the object of each of these acts is the same\n  - For this reason the Philosopher says[82]: \"Justice is that by which men will and perform just deeds [evidence]\n    - And it is clear that to perform those things which pertain to the Divine worship or service comes under the virtue of religion [restatement]\n  - Consequently it belongs to the same virtue of religion to have a prompt will to carry out these things—in other words, to be devout [consequence]\n    - Whence it follows that devotion is an act of the virtue of religion. [restatement]\n- But some argue that devotion is not an act of the virtue of religion, thus:\n- 1. Devotion means that a man gives himself to God\n  - But this belongs to the virtue of charity, for, as S. Denis says[83]: \"Divine love causes ecstasy since it permits not that those who love should belong any more to themselves, but to those things which they love [contrast]\n    - Whence devotion would seem to be rather an act of charity than of the virtue of religion. [restatement]\n- It is indeed through charity that a man gives himself to God, clinging to Him by a certain union of soul; but that a man should give himself to God and occupy himself with the Divine service, is due directly to the virtue of religion, though indirectly it is due to the virtue of charity, which is the principle of the virtue of religion.\n- 2. Again, charity precedes the virtue of religion\n  - But devotion seems to precede charity; for charity is signified in Scripture by fire, and devotion by the fat of the sacrifices—the material on which the fire feeds [contrast]\n  - Consequently devotion is not an act of the virtue of religion. [consequence]\n- But while the fat of the body is generated by the natural digestive heat, that natural heat finds its nourishment in that same fat\n  - Similarly charity both causes devotion—since it is by love that a man becomes prompt to serve his friend—and at the same time charity is fed by devotion; just as all friendship is preserved and increased by the practice of friendly acts and by meditating upon them. [analogy]\n- 3. Lastly, by the virtue of religion a man turns to God alone\n  - But devotion extends to men as well; people, for instance, are said to be devoted to certain Saints, and servants are said to be devoted to their masters, as S. Leo says of the Jews,[84] that being devoted to the Roman laws, they said: We have no king but Cæsar.[85] [contrast]\n  - Consequently devotion is not an act of the virtue of religion. [consequence]\n- But the devotion which we have to the Saints of God, whether living or dead, does not stop at them, but passes on to God, since we venerate God in God's ministers\n  - And the devotion which subjects have to their temporal masters is of a different kind altogether, just as the service of temporal masters differs from the service of the Divine Master. [restatement]\n", "stats": {"coverage": 100.0, "n_inserted": 0, "nodes": 25, "max_depth": 3, "unplaced": 0, "tags": {"contrast": 4, "consequence": 4, "evidence": 1, "restatement": 4, "analogy": 1}}}, {"slug": "17-iii-is-contemplation-that-is-meditation", "title": "III Is Contemplation, that is Meditation, the Cause of Devotion?", "group": "QUESTION LXXXII — OF DEVOTION", "words": 1324, "body": "III\n\nIs Contemplation, that is Meditation, the Cause of Devotion?\n\nIn Ps. xxxviii. 4 it is said: And in my meditation a fire shall flame out. But spiritual fire causes devotion. Therefore meditation causes devotion.\n\nThe extrinsic and principal cause of devotion is God Himself; thus S. Ambrose says[86]: \"God calls those whom He deigns to call; and whom He wills to make religious He makes religious; and had He willed it He would have made the Samaritans devout instead of indevout.\"\n\nBut the intrinsic cause of devotion on our part is meditation or contemplation. For, as we have said, devotion is a certain act of the will by which a man gives himself promptly to the Divine service. All acts of the will, however, proceed from consideration, since the will's object is good understood. Hence S. Augustine says[87]: \"The will starts from the understanding.\" Meditation must, then, be the cause of devotion inasmuch as it is from meditation that a man conceives the idea of giving himself up to God.\n\nAnd two considerations lead a man to do this: one is the consideration of the Divine Goodness and of His benefits, whence the words of the Psalmist: But for me it is good to cling close to my God, to put my hope in the Lord God.[88] And this consideration begets love, which is the proximate cause of devotion. And the second is man's consideration of his own defects which compel him to lean upon God, according to the words: I have lifted up mine eyes to the mountains, from whence help shall come to me; my help is from the Lord Who made Heaven and earth.[89] This latter consideration excludes all presumption which, by making him lean upon himself, might prevent a man from submitting himself to God.\n\nSome, however, argue that contemplation or meditation is not the cause of devotion, thus:\n\n1. No cause hinders its own effect. But subtle intellectual meditations often hinder devotion.\n\nBut it is the consideration of those things which naturally tend to excite love of God which begets devotion; consideration of things which do not come under this head, but rather distract the mind from it, are a hindrance to devotion.\n\n2. Again, if contemplation were the real cause of devotion, it should follow that the higher the matter of our contemplation the greater the devotion it begot. But the opposite is the case. For it frequently happens that greater devotion is aroused by the contemplation of the Passion of Christ and of the other mysteries of His Sacred Humanity than by meditation upon the Divine excellences.\n\nIt is true that things which concern the Godhead are of themselves more calculated to excite in us love, and consequently devotion, since God is to be loved above all things; yet it is due to the weakness of the human mind that just as it needs to be led by the hand to the knowledge of Divine things, so also must it be lead to Divine love by means of the things of sense already known to it; and the chief of these things is the Humanity of Christ, as is said in the Preface of the Mass: So that knowing God visibly in the flesh, we may thereby be carried away to the love of things invisible. Consequently the things that have to do with Christ's Humanity lead us, as it were, by the hand and are thus especially suited to stir up devotion in us; though, none the less, devotion is principally concerned with the Divinity.\n\n3. Lastly, if contemplation were the real cause of devotion, it ought to follow that those who are the more fitted for contemplation are also the more fitted for devotion; whereas the contrary is the case, for greater devotion is often found among simple folk and in the female sex, where contemplation is wanting.\n\nBut knowledge, as indeed anything which renders a person great, occasions a man to trust in Himself, and hence he does not wholly give himself to God. It is for this reason that knowledge and suchlike things are sometimes a hindrance to a man's devotion, whereas among women and simple folk devotion abounds by the suppression of all elation. But if a man will only perfectly subject to God his knowledge and any other perfection he may have, then his devotion will increase.\n\nCajetan: Note these two intrinsic causes of devotion: one, namely, which arises from meditation upon God and His benefits, the other from meditation on our own defects. Under the first head I must consider God's goodness, mercy, and kindness towards mankind and towards myself; the benefits, for instance, of creation according to His own Likeness, of Redemption, of Baptism, of His inspirations, of His invitations—whether directly or through the medium of others; His patient waiting till I do penance; His Holy Eucharist; His preserving me from so many perils both of body and soul; His care of me by means of His Angels; and His other individual benefits. Under the second head come all my faults and the punishments due to me, whether in the past or now in the present; my proneness to sin; my misuse of my own powers by habituating my thoughts and desires—as well as the inclinations of my other various faculties—to evil; my sojourning in a region far away from His Friendship and from His Divine conversation[90]; my perverted affections which make me think far more of temporal than of spiritual advantages or disadvantages; my utter lack of virtue; the wounds of my ignorance, of my malice, of my weakness, of my concupiscence; the shackles on my hands and feet, on my good works, that is; the shackles, too, on my affections, so that I dwell amidst darkness and rottenness and bitterness, and shrink not from it! My deafness, too, to the inner voice of my Shepherd; and, what is far worse, that I have chosen God for my enemy and my adversary as often as I have chosen mortal sin, and that I have thus offered Him the grievous insult of refusing to have Him for my God, and choosing instead my belly, or money, or false delights—and called them my God!\n\nMeditations such as these should be in daily use among spiritual and religious people, and for their sake they should put aside the \"much-speaking\" of vocal prayer, however much it may appeal to them. And it is of such meditations that devotion and, by consequence, other virtues, are begotten. And they who do not give themselves to this form of prayer at least once in the day cannot be called religious men or women, nor even spiritual people. There can be no effect without a cause, no end without means to it, no gaining the harbour on the island save by a voyage in a ship; and so there can be no real religion without repeated acts regarding its causes, the means to it, and the vehicle that is to bring us thither (on 2. 2. 82. 3).\n\nCajetan: Just as he who removes an obstacle is the occasion of the resulting effect—a man, for instance, who pulls down a pillar is the occasion of the resulting fall of what it supported, and a man who removes a water-dam is the occasion of the consequent flood—so in the same way have women and simple folk a cause of devotion within themselves, for they have not that obstacle which consists in self-confidence. And because God bestows His grace on those who put no obstacle to it, the Church therefore calls the female sex \"devout.\" Hence we are not to find fault with the learned for their knowledge, nor are we to praise women for womanly weakness; but that abuse of knowledge which consists in self-exaltation is blameworthy, just as the right use of women's weakness in not being uplifted is praiseworthy (on 2. 2. 82. 3).", "outline": "# III Is Contemplation, that is Meditation, the Cause of Devotion?\n\n- III\n- Is Contemplation, that is Meditation, the Cause of Devotion?\n- In Ps. xxxviii\n  - But spiritual fire causes devotion [contrast]\n  - Therefore meditation causes devotion. [consequence]\n- 4 it is said: And in my meditation a fire shall flame out\n- The extrinsic and principal cause of devotion is God Himself; thus S. Ambrose says[86]: \"God calls those whom He deigns to call; and whom He wills to make religious He makes religious; and had He willed it He would have made the Samaritans devout instead of indevout.\"\n- But the as an accidental result it causes sorrow. For, as we have said above, devotion arises from two considerations. Primarily it arises from the consideration of the Divine Goodness, and from this thought there necessarily follows gladness, in accordance with the words: I remembered God and was delighted.[91] Yet, as it were accidentally, this consideration begets a certain sadness in those who do not as yet fully enjoy God: My soul hath thirsted after the strong living God,[92] and he immediately adds: My tears have been my bread.\n\nSecondarily, however, devotion arises from the consideration of our own defects, for we thus reflect upon that from which a man, by devout acts of the will, turns away, so as no longer to dwell in himself, but to subject himself to God.\n\nAnd this consideration is the converse of the former: for of itself it tends to cause sadness since it makes us dwell upon our defects; accidentally, however, it causes joy, for it makes us think of the hope we have of God's assistance.\n\nHence joy of heart primarily and of itself follows from devotion; but secondarily and accidentally there results a sadness which is unto God.\n\nSome, however, argue that joy is not an effect of devotion, thus:\n\n1. Christ's Passion, as said before, is especially calculated to cause devotion. But from dwelling on it there follows a certain affliction of soul: Remember my poverty ... the wormwood and the gall[93]—that is, the Sacred Passion; and then follows: I will be mindful, and remember, and my soul shall languish within me.\n\nIn meditation on the Passion of Christ there is food for sadness—viz., the thought of the sins of men, and to take these away Christ had need to suffer. But there is also food for joy—viz., the thought of God's merciful kindness towards us in providing us such a deliverance.\n\n2. Again, devotion principally consists in the interior sacrifice of the heart: A sacrifice to God is an afflicted spirit;[94] consequently affliction, rather than pleasure or joy, is the outcome of devotion.\n\nBut the soul which is on the one hand saddened because of its shortcomings in this present life, is on the other hand delighted at the thought of the goodness of God and of the hope of Divine assistance.\n\n3. Lastly, S. Gregory of Nyssa says[95]: \"Just as laughter proceeds from joy, so are sorrow and groaning signs of sadness.\" But out of devotion some burst into tears.\n\nYet tears spring not from sadness alone, but also from a certain tenderness of feeling: and especially is this the case when we reflect on something that, while pleasant, has in it a certain admixture of sadness; thus men are wont to weep from loving affection when they recover their children or others dear to them whom they had thought lost. And it is in this sense that tears spring from devotion.\n\nCajetan: Notice the proof here afforded that those are not devout persons who are habitually sad and gloomy, and who cannot mingle with others without getting into difficulties or dissolving into tears. For devout folk are cheerful, and are full of joy in their souls; and this not solely by reason of the principal cause, as is stated in the text, but also by reason of a secondary cause—the thought, namely, of their own failings. For the sadness of devout folk is according to God, and joy accompanies it; whence S. Augustine's remark: \"Let a man grieve, but let him rejoice at his grief.\"[96] Therefore it is that we read of the Saints that they were joyful and bright; and rightly so, for they had begun upon earth their \"heavenly conversation\"[97] (on 2. 2. 82. 4).\n\nS. Augustine: For Thee do I yearn, Justice and Innocence, Beautiful and Fair in Thy beauteous light that satisfies and yet never sates! For with Thee is repose exceedingly and life without disquiet! He that enters into Thee enters into the joy of his Lord; he shall know no fear, and in the Best shall be best. But I have deserted Thee and have wandered away, O Lord, my God! Too far have I wandered from Thee, the Steadfast One, in my youth, and I have become to myself a very land of want! (Confessions, II. x.).", "outline": "# IV Is Joy an Effect of Devotion?\n\n- IV\n- Is Joy an Effect of Devotion?\n- In the Church's Collect for the Thursday after the Fourth Sunday of Lent we say: May holy devotion fill with joy those whom the fast they have undertaken chastises.\n- Of itself indeed, and primarily, devotion brings about a spiritual joy of the mind; but as an accidental result it causes sorrow\n  - For, as we have said above, devotion arises from two considerations [evidence]\n    - Primarily it arises from the consideration of the Divine Goodness, and from this thought there necessarily follows gladness, in accordance with the words: I remembered God and was delighted.[91] [restatement]\n  - Yet, as it were accidentally, this consideration begets a certain sadness in those who do not as yet fully enjoy God: My soul hath thirsted after the strong living God,[92] and he immediately adds: My tears have been my bread. [contrast]\n- Secondarily, however, devotion arises from the consideration of our own defects, for we thus reflect upon that from which a man, by devout acts of the will, turns away, so as no longer to dwell in himself, but to subject himself to God.\n- And this consideration is the converse of the former: for of itself it tends to cause sadness since it makes us dwell upon our defects; accidentally, however, it causes joy, for it makes us think of the hope we have of God's assistance.\n- Hence joy of heart primarily and of itself follows from devotion; but secondarily and accidentally there results a sadness which is unto God.\n- Some, however, argue that joy is not an effect of devotion, thus:\n- 1. Christ's Passion, as said before, is especially calculated to cause devotion\n  - But from dwelling on it there follows a certain affliction of soul: Remember my poverty ... the wormwood and the gall[93]—that is, the Sacred Passion; and then fo ns \"the lips' reasoning.\" Now there is this difference between the speculative and the practical reason, that the speculative reason merely apprehends things, while the practical reason not only apprehends things, but actually causes them. But one thing is the cause of another in two ways: in one way, perfectly—namely, as inducing a necessity—as happens when the effect comes entirely under the power of a cause; in another way, imperfectly—namely, by merely disposing to it—as happens when an effect is not entirely under the power of a cause.\n\nAnd so, too, reason is in two ways the cause of certain things: in one way as imposing a necessity; and in this way it belongs to the reason to command not merely the lower faculties and the bodily members, but even men who are subject to us, and this is done by giving commands. In another way as inducing, and in some sort disposing to, an effect; and in this way the reason asks for something to be done by those who are subject to it, whether they be equals or superiors.\n\nBut both of these—namely, to command something, or to ask or beg for something to be done—imply a certain arrangement—as when a man arranges for something to be done by somebody else. And in this respect both of these acts come under the reason whose office it is to arrange. Hence the Philosopher says[100]: \"Reason asks for the best things.\"\n\nHere, then, we speak of prayer as implying a certain asking or petition, for, as S. Augustine says[101]: \"Prayer is a certain kind of petition\"; so, too, S. John Damascene says[102]: \"Prayer is the asking of fitting things from God.\"\n\nHence it is clear that the prayer of which we are here speaking is an act of the reason.\n\nSome, however, think that prayer is an act of the appetitive powers, thus:\n\n1. The whole object of prayer is to be heard, and the Psalmist says that it is our desires which are heard: The Lord hath heard the desire of the poor.[103] Prayer, then, is desire; but desire is an act of the appetitive powers.\n\nBut the Lord is said to hear the desires of the poor either because their desire is the reason why they ask—since our petitions are in a certain sense the outward expression of our desires; or this may be said in order to show the swiftness with which He hears them—even while things are only existing in the poor man's desire; God hears them even before they are expressed in prayer. And this accords with the words of Isaias: And it shall come to pass that before they shall call I will hear, as they are yet speaking I will hear.[104]\n\n2. Again, Denis the Areopagite says: \"But before all things it is good to begin with prayer, as thereby giving ourselves up to and uniting ourselves with God.\"[105] But union with God comes through love, and love belongs to the appetitive powers; therefore prayer, too, would seem to belong to the appetitive powers.\n\nBut the will moves the reason to its end or object. Hence there is nothing to prevent the reason, under the direction of the will, from tending to the goal of charity, which is union with God. Prayer, however, tends towards God—moved, that is, by the will, which itself is motived by charity—in two ways: in one way by reason of that which is asked for, since in prayer we have particularly to ask that we may be united with God, according to those words: One thing I have asked of the Lord, this will I seek after, that I may dwell in the house of the Lord all the days of my life.[106] And in another way prayer tends towards God—by reason, namely, of the petitioner himself; for such a one must approach him from whom he asks something, and this either bodily, as when he draws nigh to a man, or mentally, as when he draws nigh to God.\n\nHence the same Denis says: \"When we invoke God in prayer we are before Him with our minds laid bare.\" In the same sense S. John Damascene says: \"Prayer is the ascent of the mind towards God.\"\n\nCajetan: Prayer demands of the petitioner a twofold union with God: the one is general—the union, that is, of friendship—and is produced by charity, so that further on[107] we shall find the friendship arising from charity enumerated among the conditions for infallibly efficacious prayer. The second kind of union may be termed substantial union; it is the effect of prayer itself. It is that union of application by which the mind offers itself and all it has to God in service—viz., by devout affections, by meditations, and by external acts. By such union as this a man who prays is inseparable from God in his worship and service, just as when one man serves another he is inseparable from him in his service (on 2. 2. 83. 1).\n\n\"And now, O Lord, Thou art our Father, and we are clay: and Thou art our Maker, and we are all the works of Thy hands. Be not very angry, O Lord, and remember no longer our iniquity: behold, see we are all Thy people.\"[108]", "outline": "# I Is Prayer an Act of the Appetitive Powers?\n\n- I\n- Is Prayer an Act of the Appetitive Powers?\n- S. Isidore says[98]: \"To pray is the same thing as to speak\n  - Hence prayer is not an act of the appetitive, but of the intellectual faculties. [consequence]\n- Speaking, however, belongs to the intellect\n- According to Cassiodorus, on those words of the Psalmist: Hear my prayer, O Lord, and my supplication, give ear to my tears,[99] prayer means \"the lips' reasoning\n  - But one thing is the cause of another in two ways: in one way, perfectly—namely, as inducing a necessity—as happens when the effect comes entirely under the power of a cause; in another way, imperfectly—namely, by merely disposing to it—as happens when an effect is not entirely under the power of a cause. [contrast]\n- Now there is this difference between the speculative and the practical reason, that the speculative reason merely apprehends things, while the practical reason not only apprehends things, but actually causes them\n- And so, too, reason is in two ways the cause of certain things: in one way as r.[104] [restatement]\n- 2. Again, Denis the Areopagite says: \"But before all things it is good to begin with prayer, as thereby giving ourselves up to and uniting ourselves with God.\"[105]\n  - But union with God comes through love, and love belongs to the appetitive powers; therefore prayer, too, would seem to belong to the appetitive powers. [contrast]\n- But the will moves the reason to its end or object\n  - Hence there is nothing to prevent the reason, under the direction of the will, from tending to the goal of charity, which is union with God [consequence]\n    - Prayer, however, tends towards God—moved, that is, by the will, which itself is motived by charity—in two ways: in one way by reason of that which is asked for, since in prayer we have particularly to ask that we may be united with God, according to those words: One thing I have asked of the Lord, this will I seek after, that I may dwell in the house of the Lord all the days of my life.[106] [restatement]\n      - And in another way prayer tends towards God—by reason, namely, of the petitioner himself; for such a one must approach him from whom he asks something, and this either bodily, as when he draws nigh to a man, or mentally, as when he draws nigh to God. [restatement]\n- Hence the same Denis says: \"When we invoke God in prayer we are before Him with our minds laid bare\n  - In the same sense S. John Damascene says: \"Prayer is the ascent of the mind towards God.\" [restatement]\n- Cajetan: Prayer demands of the petitioner a twofold union with God: the one is general—the union, that is, of friendship—and is produced by charity, so that further on[107] we shall find the friendship arising from charity enumerated among the conditions for infallibly efficacious prayer\n  - The second kind of union may be termed substantial union; it is the effect of prayer itself [restatement]\n    - It is that union of application by which the mind offers itself and all it has to God in service—viz., by devout  suggest that the arrangements of Divine Providence are subject to change.\n\nTo bring this out clearly we must consider that Divine Providence not merely arranges what effects shall take place, but also from what causes they shall proceed, and in what order.\n\nBut amongst other causes human acts are causes of certain effects. Hence men must do certain things, not so that their acts may change the Divine arrangement, but that by their acts they may bring about certain effects according to the order arranged by God; and it is the same with natural causes. It is the same, too, in the case of prayer. For we do not pray in order to change the Divine arrangements, but in order to win that which God arranged should be fulfilled by means of prayers; or, in S. Gregory's words: \"Men by petitioning may merit to receive what Almighty God arranged before the ages to give them.\"[111]\n\nSome, however, maintain that prayer is futile, thus:\n\n1. Prayer seems to be necessary in order that we may bring our wants to the notice of Him to Whom we make the petition. But our Lord says: Your Father knoweth that ye have need of all these things.[112]\n\nBut it is not necessary for us to set forth our petitions before God in order to make known to Him our needs or desires, but rather that we ourselves may realize that in these things it is needful to have recourse to the Divine assistance.\n\n2. Again, by prayer the mind of him to whom it is made is prevailed upon to grant what is asked of him; but the mind of God is unchangeable and inflexible: The Triumpher in Israel will not spare, and will not be moved to repentance; for He is not a man that He should repent.[113] Consequently it is unavailing to pray to God.\n\nBut our prayers do not aim at changing the Divine arrangements, but at obtaining by our prayers what God has arranged to give us.\n\n3. Lastly, it is more generous to give to one who does not ask than to one who asks, for, as Seneca remarks: \"Nothing is bought at a dearer price than what is bought with prayers.\"[114] Whereas God is most generous.\n\nGod, indeed, bestows on us many things out of His generosity, even things for which we do not ask; but He wishes to grant us some things on the supposition that we ask for them. And this is for our advantage, for it is intended to beget in us a certain confidence in having recourse to God, as well as to make us recognize that He is the Author of all good to us. Hence S. Chrysostom says: \"Reflect what great happiness is bestowed upon you, what glory is given you, namely, to converse in your prayers with God, to join in colloquy with Christ, and to beg for what you wish or desire.\"[115]\n\nCajetan: Notice how foolish are some Christians who, when desirous of reaching certain ends attainable by nature or art, are most careful to apply such means, and would rightly regard their hopes as vain unless they applied them; and yet at the same time they have quite false notions of the fruits to be derived from prayer: as though prayer were no cause at all, or at least but a remote one! Whence it comes to pass that, having false ideas about the causes, they fail to reap any fruit (on 2. 2. 83. 2).\n\nS. Augustine: But some may say: It is not so much a question whether we are to pray by words or deeds as whether we are to pray at all if God already knows what is needful for us. Yet the very giving ourselves to prayer has the effect of soothing our minds and purifying them; it makes us more fit to receive the Divine gifts which are spiritually poured out upon us. For God does not hear us because of a display of prayer on our part; He is always ready, indeed, to give us His light, not, indeed, His visible light, but the light of the intellect and the spirit. It is we who are not always prepared to receive it, and this because we are preoccupied with other things and swallowed up in the darkness resulting from desire of the things of earth. When we pray, then, our hearts must turn to God, Who is ever ready to give if only we will take what He gives. And in so turning to Him we must purify the eye of our mind by shutting out all thought for the things of time, that so—with single-minded gaze—we may be able to bear that simple light that shines divinely, and neither sets nor changes. And not merely to bear it, but even to abide in it; and this not simply without strain, but with a certain unspeakable joy. In this joy the life of the Blessed is truly and really perfected (On the Sermon on the Mount, II. iii. 14).\n\nS. Augustine: He could have bestowed these things on us even without our prayers; but He wished that by our prayers we should be taught from Whom these benefits come. For from whom do we receive them if not from Him from Whom we are bidden to ask them? Assuredly in this matter the Church does not demand laborious disputations; but note Her daily prayers: She prays that unbelievers may believe: God then brings them to the Faith. She prays that the faithful may persevere: God gives them perseverance to the end. And God foreknew that He would do these things. For this is the predestination of the Saints whom He chose in Christ before the foundation of the world[116] (Of the Gift of Perseverance, vii. 15).\n\n\"Thou hast taught me, O God, from my youth; and till now I will declare Thy wonderful works. And unto old age and grey hairs, O God, forsake me not, until I shew forth Thy arm to all the generation that is to come.\"[117]", "outline": "# II Is It Fitting To Pray?\n\n- II\n- Is It Fitting To Pray?\n- In S. Luke's Gospel we read: We ought always to pray and not to faint.[109]\n- A threefold error regarding prayer existed amongst the ancients; for some maintained that human affairs were not directed by Divine Providence; whence it followed that it was altogether vain to pray or to worship God; of such we read: You have said, he laboureth in vain that serveth God.[110]\n  - A second opinion was that all things, even human affairs, happened of necessity—whether from the immutability of Divine Providence, or from a necessity imposed by the stars, or from the connection of causes; and this opinion, of course, excluded all utility from prayer [restatement]\n    - A third opinion was that human affairs were indeed directed by Divine Providence, and that human affairs did not happen of necessity, but that Divine Providence was changeable, and that consequently its dispositions were changed by our prayers and by other acts of religious worship [restatement]\n      - These views, however, have elsewhere been shown to be wrong. [restatement]\n- Consequently we have so to set forth the utility of prayer as neither to make things happen of necessity because subject to Divine Providence, nor to suggest that the arrangements of Divine Providence are subject to change.\n- To bring this out clearly we must consider that Divine Providence not merely arranges what effects shall take place, but also from what causes they shall proceed, and in what order.\n- But amongst other causes human acts are causes of certain effects\n  - Hence men must do certain things, not so that their acts may change the Divine arrangement, but that by their acts they may bring about certain effects according to the order arranged by God; and it is the same with natural causes [consequence]\n    - It is the same, too, in the case of prayer [restatement]\n  - For we do not pray in order to change the Divine arrangements, but in order to win that which God arranged should be fulfilled by means of prayers; or, in S. Gregory's words: \"Men by petitioning may merit to receive what Almighty God arranged before the ages to give them.\"[111] [evidence]\n- Some, however, maintain that prayer is futile, thus:\n- 1. Prayer seems to be necessary in order that we may bring our wants to the notice of Him to Whom we make the petition\n  - But our Lord says: Your Father knoweth that ye have need of all these things.[112] [contrast]\n- But it is not necessary for us to set forth our petitions before God in order to make known to Him our needs or desires, but rather that we ourselves may realize that in these things it is needful to have recourse to the Divine assistance.\n- 2. Again, by prayer the mind of him to whom it is made is prevailed upon to grant what is asked of him; but the mind of God is unchangeable and inflexible: The Triumpher in Israel will not spare, and will not be moved to repentance; for He is not a man that He should repent.[113]\n  - Consequently it is unavailing to pray to God. [consequence]\n- But our prayers do not aim at changing the Divine arrangements, but at obtaining by our prayers what God has arranged to give us.\n- 3. Lastly, it is more generous to give to one who does not ask than to one who asks, for, as Seneca remarks: \"Nothing is bought at a dearer price than what is bought with prayers.\"[114]\n  - Whereas God is most generous. [contrast]\n- God, indeed, bestows on us many things out of His generosity, even things for which we do not ask; but He wishes to grant us some things on the supposition that we ask for them\n  - And this is for our advantage, for it is intended to beget in us a certain confidence in having recourse to God, as well as to make us recognize that He is the Author of all good to us [restatement]\n  - Hence S. Chrysostom says: \"Reflect what great happiness is bestowed upon you, what glory is given you, namely, to converse in your prayers with God, to join in colloquy with Christ, and to beg for what you wish or desire.\"[115] [consequence]\n- Cajetan: Notice how foolish are some Christians who, when desirous of reaching certain ends attainable by nature or art, are most careful to apply such means, and would rightly regard their hopes as vain unless they applied them; and yet at the same time they have quite false notions of the fruits to be derived from prayer: as though prayer were no cause at all, or at least but a remote one\n  - Whence it comes to pass that, having false ideas about the causes, they fail to reap any fruit (on 2 [restatement]\n- 2\n- 83\n- 2).\n- S. Augustine: But some may say: It is not so much a question whether we are to pray by words or deeds as whether we are to pray at all if God already knows what is needful for us\n  - Yet the very giving ourselves to prayer has the effect of soothing our minds and purifying them; it makes us more fit to receive the Divine gifts which are spiritually poured out upon us [contrast]\n  - For God does not hear us because of a display of prayer on our part; He is always ready, indeed, to give us His light, not, indeed, His visible light, but the light of the intellect and the spirit [evidence]\n    - It is we who are not always prepared to receive it, and this because we are preoccupied with other things and swallowed up in the darkness resulting from desire of the things of earth [restatement]\n  - When we pray, then, our hearts must turn to God, Who is ever ready to give if only we will take what He gives [qualification]\n    - And in so turning to Him we must purify the eye of our mind by shutting out all thought for the things of time, that so—with single-minded gaze—we may be able to bear that simple light that shines divinely, and neither sets nor changes [restatement]\n      - And not merely to bear it, but even to abide in it; and this not simply without strain, but with a certain unspeakable joy [restatement]\n- In this joy the life of the Blessed is truly and really perfected (On the Sermon on the Mount, II. iii\n- 14).\n- S. Augustine: He could have bestowed these things on us even without our prayers; but He wished that by our prayers we should be taught from Whom these benefits come\n  - For from whom do we receive them if not from Him from Whom we are bidden to ask them [evidence]\n    - Assuredly in this matter the Church does not demand laborious disputations; but note Her daily prayers: She prays that unbelievers may believe: God then brings them to the Faith [restatement]\n      - She prays that the faithful may persevere: God gives them perseverance to the end [restatement]\n  - And God foreknew that He would do these things [restatement]\n  - For this is the predestination of the Saints whom He chose in Christ before the foundation of the world[116] (Of the Gift of Perseverance, vii [evidence]\n- 15).\n- \"Thou hast taught me, O God, from my youth; and till now I will declare Thy wonderful works\n  - And unto old age and grey hairs, O God, forsake me not, until I shew forth Thy arm to all the generation that is to come.\"[117] [restatement]\n", "stats": {"coverage": 100.0, "n_inserted": 0, "nodes": 48, "max_depth": 4, "unplaced": 6, "tags": {"restatement": 13, "consequence": 3, "evidence": 4, "contrast": 3, "qualification": 1}}}, {"slug": "23-iii-is-prayer-an-act-of-the-virtue-of-re", "title": "III Is Prayer an Act of the Virtue of Religion?", "group": "QUESTION LXXXIII — OF PRAYER", "words": 1172, "body": "III\n\nIs Prayer an Act of the Virtue of Religion?\n\nIn Ps. cxl. 2 we read: Let my prayer be directed as incense in Thy sight, and on these words the Gloss remarks: \"According to this figure, in the Old Law incense was said to be offered as an odour of sweetness to the Lord.\" And this comes under the virtue of religion. Therefore prayer is an act of religion.\n\nIt properly belongs to the virtue of religion to give due reverence and honour to God, and hence all those things by which such reverence is shown to God come under religion. By prayer, however, a man shows reverence to God inasmuch as he submits himself to Him and, by praying, acknowledges that he needs God as the Author of all his good. Whence it is clear that prayer is properly an act of religion.\n\nSome, however, maintain that prayer is not an act of the virtue of religion, thus:\n\n1. Prayer is rather the exercise of the Gift of Understanding than of the virtue of religion. For the virtue of religion comes under Justice; it is therefore resident in the will. But prayer belongs to the intellectual faculties, as we have shown above.\n\nBut we must remember that the will moves the other faculties of the soul to their objects or ends, and that consequently the virtue of religion, which is in the will, directs the acts of the other faculties in the reverence they show towards God. Now amongst these other faculties of the soul the intellect is the noblest and the most nigh to the will; consequently, next to devotion, which belongs to the will itself, prayer, which belongs to the intellective part, is the chief act of religion, for by it religion moves a man's understanding towards God.\n\n2. Again, acts of worship fall under precept, whereas prayer seems to fall under no precept, but to proceed simply from the mere wish to pray; for prayer is merely asking for what we want; consequently prayer is not an act of the virtue of religion.\n\nYet not only to ask for what we desire, but to desire rightly, falls under precept; to desire, indeed, falls under the precept of charity, but to ask falls under the precept of religion—the precept which is laid down in the words: Ask and ye shall receive.[118]\n\n3. Lastly, the virtue of religion embraces due worship and ceremonial offered to the Divinity; prayer, however, offers God nothing, but only seeks to obtain things from Him.\n\nIn prayer a man offers to God his mind, which he subjects to Him in reverence, and which he, in some sort, lays bare before Him—as we have just seen in S. Denis's words. Hence, since the human mind is superior to all the other exterior or bodily members, and also to all exterior things which have place in the Divine worship, it follows that prayer, too, is pre-eminent among the acts of the virtue of religion.\n\nCajetan: In prayer or petition there are three things to be considered: the thing petitioned for, the actual petition, and the petitioner. As far, then, as the thing petitioned for is concerned, we give nothing to God when we pray; rather we ask Him to give us something. But if we consider the actual petition, then we do offer something to God when we pray. For the very act of petitioning is an act of subjection; it is an acknowledgment of God's power. And the proof of this is that proud men would prefer to submit to want rather than humble themselves by asking anything of others. Further, the petitioner, by the very fact that he petitions, acknowledges that he whom he petitions has the power to assist him, and is merciful, or just, or provident; it is for this reason that he hopes to be heard. Hence petition or prayer is regarded as an act of the virtue of religion, the object of which is to give honour to God. For we honour God by asking things of Him, and this by so much the more as—whether from our manner of asking or from the nature of what we ask for—we acknowledge Him to be above all things, to be our Creator, our Provider, our Redeemer, etc. And this is what S. Thomas points out in the body of the Article. But if we consider the petitioner: then, since man petitions with his mind—for petition is an act of the mind—and since the mind is the noblest thing in man, it follows that by petitioning we submit to God that which is noblest in us, since we use it to ask things of Him, and thereby do Him honour. Thus by prayer we offer our minds in sacrifice to God; so, too, by bending the knee to Him we offer to Him and sacrifice to Him our knees, by using them to His honour (on 2. 2. 83. 3).\n\nS. Augustine: I stand as a beggar at the gate, He sleepeth not on Whom I call! Oh, may He give me those three loaves! For you remember the Gospel? Ah! see how good a thing it is to know God's word; those of you who have read it are stirred within yourselves! For you remember how a needy man came to his friend's house and asked for three loaves. And He says that he sleepily replied to him: \"I am resting, and my children are with me asleep.\" But he persevered in his request, and wrung from him by his importunity what his deserts could not get. But God wishes to give; yet only to those who ask—lest He should give to those who understand not. He does not wish to be stirred up by your weariness! For when you pray you are not being troublesome to one who sleeps; He slumbereth not nor sleeps that keepeth Israel.[119] ... He, then, sleeps not; see you that your faith sleeps not! (Enarr. in Ps. cii. 10).\n\nS. Augustine: Some there are who either do not pray at all, or pray but tepidly; and this because, forsooth, they have learnt from the Lord Himself[120] that God knows, even before we ask Him, what is necessary for us. But because of such folk are we to say that these words are not true and therefore to be blotted out of the Gospel? Nay, rather, since it is clear that God gives some things even to those who do not ask—as, for instance, the beginnings of faith—and has prepared other things for those only who pray for them—as, for instance, final perseverance—it is evident that he who fancies he has this latter of himself does not pray to have it (Of the Gift of Perseverance, xvi. 39).\n\n\"I will sing to the Lord as long as I live; I will sing praise to my God while I have my being. Let my speech be acceptable to Him; but I will take delight in the Lord.\"[121]", "outline": "# III Is Prayer an Act of the Virtue of Religion?\n\n- III\n- Is Prayer an Act of the Virtue of Religion?\n- In Ps. cxl\n  - And this comes under the virtue of religion [restatement]\n  - Therefore prayer is an act of religion. [consequence]\n- 2 we read: Let my prayer be directed as incense in Thy sight, and on these words the Gloss remarks: \"According to this figure, in the Old Law incense was said to be offered as an odour of sweetness to the Lord\n- It properly belongs to the virtue of religion to give due reverence and honour to God, and hence all those things by which such reverence is shown to God come under religion\n  - By prayer, however, a man shows reverence to God inasmuch as he submits himself to Him ce to God; so, too, by bending the knee to Him we offer to Him and sacrifice to Him our knees, by using them to His honour (on 2 [consequence]\n- 2\n- 83\n- 3).\n- S. Augustine: I stand as a beggar at the gate, He sleepeth not on Whom I call\n  - For you remember the Gospel [evidence]\n  - For you remember how a needy man came to his friend's house and asked for three loaves [evidence]\n    - And He says that he sleepily replied to him: \"I am resting, and my children are with me asleep [restatement]\n  - But he persevered in his request, and wrung from him by his importunity what his deserts could not get [contrast]\n  - But God wishes to give; yet only to those who ask—lest He should give to those who understand not [contrast]\n    - He does not wish to be stirred up by your weariness [restatement]\n  - For when you pray you are not being troublesome to one who sleeps; He slumbereth not nor sleeps that keepeth Israel.[119] [evidence]\n    - He, then, sleeps not; see you that your faith sleeps not [restatement]\n- Oh, may He give me those three loaves\n- Ah! see how good a thing it is to know God's word; those of you who have read it are stirred within yourselves\n- (Enarr. in Ps. cii\n- 10).\n- S. Augustine: Some there are who either do not pray at all, or pray but tepidly; and this because, forsooth, they have learnt from the Lord Himself[120] that God knows, even before we ask Him, what is necessary for us\n  - But because of such folk are we to say that these words are not true and therefore to be blotted out of the Gospel [contrast]\n    - Nay, rather, since it is clear that God gives some things even to those who do not ask—as, for instance, the beginnings of faith—and has prepared other things for those only who pray for them—as, for instance, final perseverance—it is evident that he who fancies he has this latter of himself does not pray to have it (Of the Gift of Perseverance, xvi [restatement]\n- 39).\n- \"I will sing to the Lord as long as I live; I will ship to those whom we seek to have as intercessors with us before God.\n\n2. Again, prayer to those who cannot know what we pray for is idle. But God alone can know our prayers, and this because prayer is frequently a purely interior act of which God alone is cognizant, as the Apostle says: I will pray with the spirit. I will pray also with the understanding;[124] and also because, as S. Augustine says[125]: The dead know not, not even the Saints, what the living—not even excepting their own children—are doing.\n\nIt is true that the dead, if we consider only their natural condition, do not know what is done on earth, and especially do they not know the interior movements of the heart. But to the Blessed, as S. Gregory says,[126] manifestation is made in the Divine Word of those things which it is fitting that they should know as taking place in our regard, even the interior movements of the heart. And, indeed, it is most befitting their state of excellence that they should be cognizant of petitions addressed to them, whether vocally or mentally. Hence through God's revelation they are cognizant of the petitions which we address them.\n\n3. Lastly, some say: if we do address prayers to any of the Saints, the sole reason for doing so lies in the fact that they are closely united to God. But we do not address prayers to people who, while still living in this world, are closely knit to God, nor to those who are in Purgatory and are united to Him. There seems, then, to be no reason why we should address prayers to the Saints in Paradise.\n\nBut they who are still in the world or in Purgatory do not as yet enjoy the vision of the Divine Word so as to be able to know what we think or say, hence we do not implore their help when we pray; though when talking with living people we do ask them to help us.\n\nS. Augustine: It is no great thing to live long, nor even to live for ever; but it is indeed a great thing to live well. Oh, let us love eternal life! And we realize how earnestly we ought to strive for that eternal life when we note how men who love this present temporal life so work for it—though it is to pass away—that, when the fear of death comes, they strive all they can, not, indeed, to do away with death, but to put death off! How men labour when death approaches! They flee from it; they hide from it; they give all they have; they try to buy themselves off; they work and strive; they put up with tortures and inconveniences; they call in physicians; they do everything that lies within their power! Yet even if they spend all their toil and their substance, they can only secure that they may live a little longer, not that they may live for ever! If, then, men spend such toil, such endeavour, so much money, so much anxiety, watchfulness, and care, in order to live only a little longer, what ought we not to do that we may live for ever? And if we call them prudent who take every possible precaution to stave off death, to live but a few days more, to save just a few days, then how foolish are they who so pass their days as to lose the Day of Eternity! (Sermon, cxxvii. 2).\n\n\"May God have mercy on us, and bless us: may He cause the light of His countenance to shine upon us, and may He have mercy on us. That we may know Thy way upon earth: Thy salvation in all nations. Let people confess to Thee, O God: let all people give praise to Thee. Let the nations be glad and rejoice: for Thou judgest the people with justice, and directest the nations upon earth. Let the people, O God, confess to Thee: let all the people give praise to Thee: the earth hath yielded her fruit. May God, our God bless us, may God bless us: and all the ends of the earth fear Him.\"[127]", "outline": "# IV Ought We To Pray To God Alone?\n\n- IV\n- Ought We To Pray To God Alone?\n- In Job v\n- 1 we read: Call, now, if there be any that will answer thee, and turn to some of the Saints.\n- Prayer is addressed to a person in two ways: in one way as a petition to be g tural condition, do not know what is done on earth, and especially do they not know the interior movements of the heart\n  - But to the Blessed, as S. Gregory says,[126] manifestation is made in the Divine Word of those things which it is fitting that they should know as taking place in our regard, even the interior movements of the heart [contrast]\n    - And, indeed, it is most befitting their state of excellence that they should be cognizant of petitions addressed to them, whether vocally or mentally [restatement]\n  - Hence through God's revelation they are cognizant of the petitions which we address them. [consequence]\n- 3. Lastly, some say: if we do address prayers to any of the Saints, the sole reason for doing so lies in the fact that they are closely united to God\n  - But we do not address prayers to people who, while still living in this world, are closely knit to God, nor to those who are in Purgatory and are united to Him [contrast]\n    - There seems, then, to be no reason why we should address prayers to the Saints in Paradise. [restatement]\n- But they who are still in the world or in Purgatory do not as yet enjoy the vision of the Divine Word so as to be able to know what we think or say, hence we do not implore their help when we pray; though when talking with living people we do ask them to help us.\n- S. Augustine: It is no great thing to live long, nor even to live for ever; but it is indeed a great thing to live well\n  - And we realize how earnestly we ought to strive for that eternal life when we note how men who love this present temporal life so work for it—though it is to pass away—that, when the fear of death comes, they strive all they can, not, indeed, to do away with death, but to put death off [restatement]\n    - How men labour when death approaches [restatement]\n      - They flee from it; they hide from it; they give all they have; they try to buy themselves off; they work and strive; they put up with tortures and inconveniences; Thus shalt thou pray.[128]\n\nMaximus Valerius tells of Socrates[129] that he \"maintained that nothing further should be asked of the immortal gods save that they should give us good things; and this on the ground that they knew well what was best for each individual, whereas we often ask in our prayers for things which it would be better not to have asked for.\" And this opinion has some truth in it as regards those things which can turn out ill, or which a man can use well or ill, as, for example, riches which, as the same Socrates says, \"have been to the destruction of many; or honours which have ruined many; or the possession of kingdoms, the issues of which are so often ill-fated; or splendid matrimonial alliances, which have sometimes proved the ruin of families.\" But there are certain good things of which a man cannot make a bad use—those, namely, which cannot have a bad issue. And these are the things by which we are rendered blessed and by which we merit beatitude; these are the things for which the Saints pray unconditionally: Show us Thy Face and we shall be saved;[130] and again: Lead me along the path of Thy commandments.[131]\n\nSome, however, say that we ought not in our prayers to ask for definite things from God, thus:\n\n1. S. John Damascene defines prayer as \"asking from God things that are fitting\";[132] consequently prayer for things which are not expedient is of no efficacy, as S. James says: You ask and receive not, because you ask amiss.[133] Moreover, S. Paul says: We know not what we should pray for as we ought.[134]\n\nBut it is also true that though a man cannot of himself know what he ought to pray for, yet, as the Apostle says in the same place: In this the Spirit helpeth our infirmity—namely, in that, by inspiring us with holy desires, He makes us ask aright. Hence Our Lord says that the true adorers must adore in spirit and in truth.[135]\n\n2. Further, he who asks from another some definite thing strives to bend that other's will to do what the petitioner wants. But we ought not to direct our prayers towards making God will what we will, but rather we should will what He wills—as the Gloss says on the words of Ps. xxxii. 1: Rejoice in the Lord, O ye just! It would seem, therefore, that we ought not to ask for definite things from God when we pray.\n\nYet when in our prayers we ask for things which appertain to our salvation, we are conforming our will to the will of God, for of His will it is said: He will have all men to be saved.[136]\n\n3. Lastly, evil things cannot be asked from God; and He Himself invites us to receive good things. But it is idle for a person to ask for what he is invited to receive.\n\nGod, it is true, invites us to receive good things; but He wishes us to come to them—not, indeed, by the footsteps of the body—but by pious desires and devout prayers.\n\nS. Augustine: Fly, then, by unwavering faith and holy habits, fly, brethren, from those torments where the torturers never desist, and where the tortured never die; whose death is unending, and where in their anguish they cannot die. But burn with love for and desire of the eternal life of the Saints where there is no longer the life of toil nor yet wearisome repose. For the praises of God will beget no disgust, neither will they ever cease. There will there be no weariness of the soul, no bodily fatigue; there will there be no wants: neither wants of your own which will call for succour, nor wants of your neighbour demanding your speedy help. God will be all your delight; there will ye find the abundance of that Holy City that from Him draws life and happily and wisely lives in Him. For there, according to that promise of His for which we hope and wait, we shall be made equal to the Angels of God; and equally with them shall we then enjoy that vision of the Holy Trinity in which we now but walk by faith. For we now believe what we do not see, that so by the merits of that same faith we then may merit to see what we believe, and may so hold fast to it that the Equality of Father, Son, and Holy Ghost, and the Unity of the Trinity, may no longer come to us under the garb of faith, nor be the subject of contentious talk, but may rather be what we may drink in in purest and deepest contemplation amid the silence of Eternity (De Catechizandis Rudibus, xxv. 47).\n\nS. Augustine: O Lord, my God, give me what Thou biddest and then bid what Thou wilt! Thou biddest us be continent. And I knew, as a certain one says, that I could not otherwise be continent save God gave it, and this also was a point of wisdom to know Whose gift it was. Now by continence we are knit together and brought back into union with that One from Whom we have wandered away after many things. For he loves Thee but little who loves other things with Thee, and loves them not for Thee! O Love that ever burnest and wilt never be extinguished! O Charity! O Lord, my God, set me on fire! Thou dost bid continence? Then give me what Thou biddest and bid what Thou wilt! (Confessions, X. xxix.).\n\nS. Augustine: O Lord, my God, listen to my prayer and mercifully hear my desire! For my desire burns not for myself alone, but fraternal charity bids it be of use. And Thou seest in my heart that it is so; for I would offer to Thee in sacrifice the service of my thoughts and of my tongue. Grant me then what I may offer to Thee. For I am needy and poor, and Thou art rich towards all that call upon Thee; for in peace and tranquillity hast Thou care for us. Circumcise, then, my lips, within and without, from all rashness and all untruthfulness. May Thy Scriptures be my chaste delight; may I never be deceived in them nor deceive others out of them. Attend, O Lord, and have mercy upon me, O Lord, my God. Thou art the Light of the blind, the Strength of the weak, and so, too, art Thou the Light of them that see and the Strength of them that are strong. Look, then, on my soul, and hear me when I cry from out the depths! (Confessions, XI. ii
